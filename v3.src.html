function PredictionsScreen({athletes,activeAth,setActiveAth,workouts,onEditAthlete}){
  const prof=athProfile(athletes.find(a=>a.id===activeAth));
  const myWk=workouts.filter(w=>w.athletes&&w.athletes[activeAth]&&w.endTime).sort((a,b)=>a.startTime-b.startTime);
  const FLY=['fly-10m-1','fly-10m-2','fly-10m-3'];
  // best free 10m fly (s) from the last 2 sessions that logged a fly time
  const flyPer=[];
  myWk.forEach(w=>{const ad=w.athletes[activeAth];let best=Infinity;
    Object.keys(ad.sets||{}).forEach(eid=>{const base=baseExId(eid);if(base.includes('overspeed')||base.includes('resisted'))return;
      (ad.sets[eid]||[]).forEach(s=>{if(!s.completed||s.warmup)return;const v=s.values||{};
        FLY.forEach(m=>{const t=Number(v[m]);if(t>0&&t<best)best=t})})});
    if(best<Infinity)flyPer.push(best)});
  const last2=flyPer.slice(-2);
  const maxVel=last2.length?Math.round(1000/Math.min(...last2))/100:null;
  // efficiency = jump cm / approach velocity. Collect every logged jump that has both;
  // the most reliable number is the one from the longest approach (tie -> most recent).
  const effCands=[];
  myWk.forEach(w=>{const ad=w.athletes[activeAth];
    Object.keys(ad.sets||{}).forEach(eid=>{const g=markGroupOf(eid);if(!g)return;
      (ad.sets[eid]||[]).forEach(s=>{if(!s.completed||s.warmup||s.flop)return;const v=s.values||{};
        const d=Number(v['tf-dist']),t=Number(v['time-10-1m']);
        if(d>0&&t>0)effCands.push({eff:(d*100)/(10/t),vel:10/t,steps:MARK_GROUP_STEPS[g]||0,group:g,date:w.startTime})})})});
  // best efficiency per approach length, longest first
  const effByGroup={};
  effCands.forEach(c=>{const cur=effByGroup[c.group];if(!cur||c.eff>cur.eff)effByGroup[c.group]={eff:c.eff,vel:c.vel,steps:c.steps,group:c.group,date:c.date}});
  const effRows=Object.values(effByGroup).sort((a,b)=>b.steps-a.steps);
  const effPick=effRows[0]||null;
  const efficiency=effPick?Math.round(effPick.eff*10)/10:null;
  // PB: biggest logged long jump (cm), floored at the starting PB
  let pbCm=prof.startPB;
  myWk.forEach(w=>{const ad=w.athletes[activeAth];
    Object.keys(ad.sets||{}).forEach(eid=>{if(!markGroupOf(eid))return;
      (ad.sets[eid]||[]).forEach(s=>{if(!s.completed||s.warmup||s.flop)return;
        const d=Number(s.values&&s.values['tf-dist']);if(d>0&&Math.round(d*100)>pbCm)pbCm=Math.round(d*100)})})});
  // most recent logged last-10m approach split (for the split table)
  let lastSplit=null,lastSplitT=-1;
  myWk.forEach(w=>{const ad=w.athletes[activeAth];
    Object.keys(ad.sets||{}).forEach(eid=>{if(!markGroupOf(eid))return;
      (ad.sets[eid]||[]).forEach(s=>{if(!s.completed||s.warmup||s.flop)return;
        const t=Number(s.values&&s.values['time-10-1m']);
        if(t>0&&w.startTime>=lastSplitT){lastSplitT=w.startTime;lastSplit=t}})})});
  const[appPct,setAppPct]=useState(95);
  const[effOverride,setEffOverride]=useState(null);
  const[selEffGroup,setSelEffGroup]=useState(null);
  useEffect(()=>{setEffOverride(null);setSelEffGroup(null);setAppPct(95)},[activeAth]);
  const eff=effOverride!=null?effOverride:efficiency;
  const ready=maxVel!=null&&eff!=null;
  const predict=(pct,e)=>Math.round(maxVel*(pct/100)*e);
  const heroPred=ready?predict(appPct,eff):0;
  const delta=heroPred-pbCm;
  // the 10m split you'd need in the last 10m of the run-up for a given approach %
  const splitStr=pct=>maxVel?(10/(maxVel*pct/100)).toFixed(2):'—';
  // split table: efficiency columns (cur-2 / cur / cur+2 / cur+4), split rows around the last split
  const effBase=efficiency!=null?Math.round(efficiency):null;
  const effCols=effBase!=null?[effBase-2,effBase,effBase+2,effBase+4]:[];
  const splitRows=lastSplit!=null?[-4,-3,-2,-1,0,1,2,3,4].map(i=>Math.round((lastSplit+i*0.02)*100)/100):[];
  const tableReady=effBase!=null&&lastSplit!=null;
  // performance factors vs age-band norms
  const setsOf=exId=>{const out=[];myWk.forEach(w=>{const ad=w.athletes[activeAth];
    Object.keys(ad.sets||{}).filter(k=>baseExId(k)===exId).forEach(k=>{(ad.sets[k]||[]).forEach(s=>{
      if(s.completed&&!s.warmup&&!s.flop)out.push(s.values||{})})})});return out};
  const factorValue=src=>{
    if(src.type==='fly')return maxVel?Math.round(1000/maxVel)/100:null;
    if(src.type==='pb')return pbCm;
    if(src.type==='metric'){let b=null;setsOf(src.ex).forEach(v=>{const x=Number(v[src.m]);
      if(x>0&&(b==null||(src.lo?x<b:x>b)))b=x});return b}
    if(src.type==='slbounds'){let b=null;['sl-bounds-pr-l','sl-bounds-pr-r'].forEach(ex=>setsOf(ex).forEach(v=>{
      const x=Number(v['tf-dist']);if(x>0&&(b==null||x>b))b=x}));return b}

      if(h>0&&g>0){const r=h/g;if(b==null||r>b)b=r}});return b!=null?Math.round(b*100)/100:null}

    </div>);};
  // which efficiency card is active (defaults to the longest approach)
  const activeEffGroup=selEffGroup||(effRows[0]&&effRows[0].group);
  const actEffRow=effRows.find(r=>r.group===activeEffGroup)||effPick;
  const effLabel=actEffRow?(MARK_GROUP_LABEL[actEffRow.group]||'approach'):'';

  const effDateStr=actEffRow?new Date(actEffRow.date).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
  // click an efficiency card -> use that attempt's efficiency + its approach speed
  const pickEff=r=>{setSelEffGroup(r.group);setEffOverride(Math.round(r.eff*10)/10);
    if(maxVel)setAppPct(Math.max(75,Math.min(100,Math.round(r.vel/maxVel*100))))};
  return(<div className="shell">
    <div className="top" style={{paddingBottom:14}}>
      <div className="ath-stack">
        {(athletes||[]).map(a=>(<button key={a.id} className={'ath-circle'+(a.id===activeAth?' on':'')}
          style={{'--ac':a.color||'#2156f4'}}
          onClick={()=>{a.id===activeAth?(onEditAthlete&&onEditAthlete(a)):(setActiveAth&&setActiveAth(a.id))}}>
          {a.photo?<img src={a.photo} alt=""/>:<span>{initials(a.name||'')}</span>}
        </button>))}
      </div>
      <div className="top-month">PREDICTIONS</div>
      <div className="top-spacer"/>
    </div>

                    {v!=null?<div className="pf-pct">{(gap>=0?'+':'')+gap} vs elite</div>:<div className="pf-pct nd">no data yet</div>}
                  </div>
                </div>
              </div>);}
            const cf=perfNorms.filter(f=>f.cat===cat);if(!cf.length)return null;
            let extra=null;
            if(cat==='HORIZONTAL POWER'){

              const rv=factorValue({type:'metric',ex:'sl-bounds-pr-r',m:'tf-dist'});
              const asym=(lv!=null&&rv!=null&&Math.max(lv,rv)>0)?Math.abs(lv-rv)/Math.max(lv,rv)*100:null;
              const ab=asym==null?null:asym<5?0:asym<10?1:3;
              extra=(<div className={'pf-card'+(ab==null?'':' pf-b'+ab)}>
                <div className="pf-name">L/R Asymmetry</div>

                <div className="pf-norm">{lv!=null&&rv!=null?'L '+lv.toFixed(2)+' · R '+rv.toFixed(2):'needs L & R'}</div>
                {asym!=null?<div className="pf-pct">{asym<5?'balanced':asym<10?'slight gap':'imbalance'}</div>:<div className="pf-pct nd">no data yet</div>}
              </div>);
            }
            return(<div key={cat}>
              <div className="pf-cat">{cat}</div>
              <div className="pf-row">{cf.map(renderFactorCard)}{extra}</div>
            </div>)})}
        </div>}
    </div>
  </div>);
}

// High-intensity weekly load — sprints, approaches, bounds, wickets, flys. Used
// by the Week Load chart and overlaid behind the Tendon Pain Trend.
function computeWeekLoad(sw,activeAth){
  const distOf=(eid,v)=>{if(markGroupOf(eid)){const d=Number(v['tf-dist']);return d>0?d:0}
    const mm=baseExId(eid).match(/(\d+)m/);if(mm)return Number(mm[1]);
    const d=Number(v.distance)||Number(v['tf-dist']);return d>0?d:0};
  const hi=eid=>{const bx=baseExId(eid);return /sprint|start-|accel|overspeed|fly|wicket|bound/.test(bx)||!!markGroupOf(eid)};
  const wkm={};const wkTs={};
  sw.forEach(w=>{const ad=w.athletes[activeAth];if(!ad)return;
    const d=new Date(w.startTime);
    const mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));mon.setHours(0,0,0,0);
    const key=dateKey(mon.getTime());
    Object.keys(ad.sets||{}).forEach(eid=>{if(!hi(eid))return;
      (ad.sets[eid]||[]).forEach(s=>{if(!s.completed||s.warmup||s.flop)return;
        wkm[key]=(wkm[key]||0)+distOf(eid,s.values||{});wkTs[key]=mon.getTime()})})});
  const keys=Object.keys(wkm).sort();
  if(!keys.length)return null;
  const vals=keys.map(k=>Math.round(wkm[k]));
  const last=vals[vals.length-1];
  const prev=vals.slice(-5,-1);
  const avg=prev.length?prev.reduce((a,b)=>a+b,0)/prev.length:0;
  const spike=avg>0&&last>avg*1.3;
  const mx=Math.max(...vals,1);
  const wkData=keys.map(k=>({ts:wkTs[k],val:Math.round(wkm[k])}));
  return{wkm,keys,vals,last,avg,spike,mx,wkData};
}

function StatScreen({workouts,activeAth,exercises,onView,onSelectEx,remoteSession,onResume,athletes,setActiveAth,onEditAthlete}){
  const myWk=workouts.filter(w=>w.athletes?.[activeAth]);
  const[q,setQ]=useState('');
  // Build per-exercise PRs (across all metrics: best per metric)
  const prMap={};
  myWk.forEach(w=>{const ad=w.athletes?.[activeAth];if(!ad)return;
    Object.keys(ad.sets||{}).forEach(eid=>{const base=baseExId(eid);
      const ex=exercises.find(e=>e.id===base);if(!ex)return;
      ad.sets[eid].filter(s=>s.completed&&!s.warmup).forEach(s=>{
        const v=s.values||{};
        if(!prMap[base])prMap[base]={name:ex.name,category:ex.category,metrics:{},lastDate:0};
        ex.metrics.forEach(m=>{if(m==='approach-mark'||m==='wicket-spc')return;const val=Number(v[m]);if(!val||isNaN(val))return;
          const md=METRIC_MAP[m]||{name:m,unit:''};
          // Time metrics: lower is better. Distance/weight/reps: higher is better.
          const lowerBetter=md.unit==='s'||m==='tf-time'||m.startsWith('split-')||m.startsWith('fly-')||m.startsWith('time-');
          const cur=prMap[base].metrics[m];
          if(!cur||(lowerBetter?val<cur.val:val>cur.val)){
            prMap[base].metrics[m]={val,unit:md.unit,name:md.name,date:w.startTime,lowerBetter}}});
        prMap[base].lastDate=Math.max(prMap[base].lastDate,w.startTime)})})});

  // Group: Sprint PBs (start-*), Resisted Sprint PBs (resisted-*), Fly (fly-*), Everything else
  const isSprint=id=>id.startsWith('start-');
  const isResisted=id=>id.startsWith('resisted-');
  const isFly=id=>id.startsWith('fly-')&&!id.startsWith('fly-sprint');
  const sprintIds=Object.keys(prMap).filter(isSprint);
  const resistedIds=Object.keys(prMap).filter(isResisted);
  const flyIds=Object.keys(prMap).filter(isFly);
  const otherIds=Object.keys(prMap).filter(id=>!isSprint(id)&&!isResisted(id)&&!isFly(id));
  // Sort sprint distances numerically: start-10m → 10
  const distOrd=id=>{const m=id.match(/(\d+)m/);return m?parseInt(m[1]):999};
  sprintIds.sort((a,b)=>distOrd(a)-distOrd(b));
  resistedIds.sort((a,b)=>distOrd(a)-distOrd(b));
  flyIds.sort((a,b)=>distOrd(a)-distOrd(b));
  otherIds.sort((a,b)=>(prMap[a].lastDate||0)<(prMap[b].lastDate||0)?1:-1);

  // best value of one metric per session, chronological
  const seriesFor=(base,metric,lowerBetter)=>{const pts=[];
    [...myWk].sort((a,b)=>a.startTime-b.startTime).forEach(w=>{const ad=w.athletes[activeAth];if(!ad)return;
      let best=null;
      Object.keys(ad.sets||{}).filter(k=>baseExId(k)===base).forEach(k=>{
        ad.sets[k].filter(s=>s.completed&&!s.warmup).forEach(s=>{const v=Number(s.values?.[metric]);if(!v||isNaN(v))return;
          if(best==null||(lowerBetter?v<best:v>best))best=v})});
      if(best!=null)pts.push(best)});
    return pts};
  const renderRow=(eid)=>{const p=prMap[eid];const ex=exercises.find(e=>e.id===eid);
    const mets=Object.entries(p.metrics);if(!mets.length)return null;
    const pmEntry=mets.find(([m])=>m==='tf-time'||m==='weight')||mets[0];
    const pm=pmEntry[0],pmInfo=p.metrics[pm];
    const CC={'T&F':'#06b6d4',Legs:'#8b5cf6',Chest:'#ef4444',Back:'#22c55e',Shoulders:'#f97316',Arms:'#2156f4',Core:'#f59e0b',Cardio:'#ec4899'};
    const col=CC[p.category]||'#94a3b8';
    return(<button key={eid} className="pr-card" style={{borderLeft:'3px solid '+col}} onClick={()=>ex&&onSelectEx&&onSelectEx(ex)}>
      <div className="pr-card-top">
        <span className="pr-card-name">{p.name}</span>
        <span style={{display:'flex',alignItems:'center',gap:7,flexShrink:0}}>
          {p.category&&<span style={{fontFamily:'var(--mono)',fontSize:8.5,fontWeight:800,letterSpacing:'.5px',textTransform:'uppercase',color:col,background:col+'22',padding:'3px 7px',borderRadius:5}}>{p.category}</span>}
          <Ic n="chevR" s={16}/>
        </span>
      </div>
      <TrendChart values={seriesFor(eid,pm,pmInfo.lowerBetter)} lowerBetter={pmInfo.lowerBetter}/>
      <div className="pr-metrics">
        {mets.map(([m,r])=>(<div key={m} className="pr-metric">
          <div className="pr-metric-v">{r.val}<span className="u">{r.unit}</span></div>
          <div className="pr-metric-l">{r.name}</div>
        </div>))}
      </div>
    </button>)};
  const matchQ=eid=>!q.trim()||prMap[eid].name.toLowerCase().includes(q.trim().toLowerCase());
  const section=(title,ids)=>{const f=ids.filter(matchQ);return f.length>0?<><div className="s-title">{title}</div><div className="recent">{f.map(renderRow)}</div></>:null};
  const noMatch=Object.keys(prMap).length>0&&!Object.keys(prMap).some(matchQ);
  // Velocity trend: fastest free 10m fly per session, as m/s
  const FLY10=['fly-10m-1','fly-10m-2','fly-10m-3'];
  const velo=[];
  [...myWk].sort((a,b)=>a.startTime-b.startTime).forEach(w=>{const ad=w.athletes[activeAth];if(!ad)return;
    let fastest=Infinity;
    Object.keys(ad.sets||{}).forEach(eid=>{const base=baseExId(eid);
      if(base.includes('overspeed')||base.includes('resisted'))return;
      ad.sets[eid].filter(s=>s.completed&&!s.warmup).forEach(s=>{const v=s.values||{};
        FLY10.forEach(m=>{const t=Number(v[m]);if(t>0&&t<fastest)fastest=t});
        if(base==='fly-10m'){const t=Number(v['tf-time']);if(t>0&&t<fastest)fastest=t}})});
    if(fastest<Infinity&&fastest>0)velo.push(Math.round(1000/fastest)/100)});
  const d30=myWk.filter(w=>Date.now()-w.startTime<30*864e5).length;
  const d7=myWk.filter(w=>Date.now()-w.startTime<7*864e5).length;

  return(<div className="shell">
    <div className="top" style={{paddingBottom:14}}>
      <div className="ath-stack">
        {(athletes||[]).map(a=>(<button key={a.id} className={'ath-circle'+(a.id===activeAth?' on':'')}
          style={{'--ac':a.color||'#2156f4'}}
          onClick={()=>{a.id===activeAth?(onEditAthlete&&onEditAthlete(a)):(setActiveAth&&setActiveAth(a.id))}}>
          {a.photo?<img src={a.photo} alt=""/>:<span>{initials(a.name||'')}</span>}
        </button>))}
      </div>
      <div className="top-month">INSIGHTS</div>
      <div className="top-spacer"/>
    </div>
    <div className="scroll">
      {velo.length>=1&&(()=>{const last=velo[velo.length-1];const best=Math.max(...velo);
        const hasPrev=velo.length>=2;const delta=hasPrev?last-velo[velo.length-2]:0;
        return(<div className="velo-hero">
          <div className="velo-head">
            <span className="velo-label">Top Speed · 10m Fly</span>
            {hasPrev&&<span className="velo-best">Best {best.toFixed(2)} m/s</span>}
          </div>
          <div className="velo-big">{last.toFixed(2)}<span className="velo-unit">m/s</span></div>
          {hasPrev?<><div className="velo-delta" style={{color:delta>0?'#16a34a':delta<0?'#ef4444':'rgba(255,255,255,.5)'}}>
            {delta>0?'▲':delta<0?'▼':'•'} {Math.abs(delta).toFixed(2)} m/s ({delta>=0?'+':''}{(delta/(last-delta||1)*100).toFixed(1)}%) vs last session</div>
            <TrendChart values={velo} lowerBetter={false} refLines={[{val:best,label:'BEST '+best.toFixed(2),color:'rgba(255,255,255,.45)'}]}/></>
            :<div className="velo-delta" style={{color:'rgba(255,255,255,.5)'}}>Log another speed session to see the trend</div>}
        </div>)})()}

      {remoteSession&&<>
        <div className="s-title">In Progress</div>
        <div className="recent">
          <button className="recent-row" onClick={onResume}>
            <div className="ex-pr-icon" style={{background:'#10b981',color:'#fff',borderRadius:8}}><Ic n="play" s={14}/></div>
            <div className="recent-info">
              <div className="recent-name">{remoteSession.plan?.name||'Live Workout'}</div>
              <div className="recent-meta">Started {new Date(remoteSession.updatedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
            </div>
            <Ic n="chevR" s={16}/>
          </button>
        </div>
      </>}

      {(()=>{
        const prof=athProfile(athletes.find(a=>a.id===activeAth));
        const sw=[...myWk].sort((a,b)=>a.startTime-b.startTime);
        const FLY=['fly-10m-1','fly-10m-2','fly-10m-3'];
        const flyPer=[];sw.forEach(w=>{const ad=w.athletes[activeAth];let b=Infinity;
          Object.keys(ad.sets||{}).forEach(eid=>{const bx=baseExId(eid);if(bx.includes('overspeed')||bx.includes('resisted'))return;
            (ad.sets[eid]||[]).forEach(s=>{if(!s.completed||s.warmup)return;FLY.forEach(m=>{const t=Number(s.values&&s.values[m]);if(t>0&&t<b)b=t})})});
          if(b<Infinity)flyPer.push(b)});
        const maxVel=flyPer.length?Math.round(1000/Math.min(...flyPer.slice(-2)))/100:null;
        const effSeries=[];const effBG={};
        sw.forEach(w=>{const ad=w.athletes[activeAth];let be=null;
          Object.keys(ad.sets||{}).forEach(eid=>{const g=markGroupOf(eid);if(!g)return;
            (ad.sets[eid]||[]).forEach(s=>{if(!s.completed||s.warmup||s.flop)return;
              const d=Number(s.values&&s.values['tf-dist']),t=Number(s.values&&s.values['time-10-1m']);
              if(d>0&&t>0){const e=(d*100)/(10/t);if(be==null||e>be)be=e;
                const st=MARK_GROUP_STEPS[g]||0;if(!effBG[st]||e>effBG[st])effBG[st]=e}})});
          if(be!=null)effSeries.push(Math.round(be*10)/10)});
        const effSteps=Object.keys(effBG).map(Number).sort((a,b)=>b-a);
        const efficiency=effSteps.length?Math.round(effBG[effSteps[0]]*10)/10:null;
        let pb=prof.startPB;myWk.forEach(w=>{const ad=w.athletes[activeAth];

          {effSeries.length>=1&&(()=>{const eliteV=ELITE_EFF[prof.sex]||ELITE_EFF.m;return<>

          {isMiska&&tendData.length>=1&&(()=>{

            const wkD=wk?wk.wkData:[];

            const W=320,H=110,pad=15;

            const X=t=>pad+((t-t0)/tspan)*(W-2*pad);

              <div className="s-title">Tendon Pain Trend</div>

                  {wkD.length>0&&<span style={{fontFamily:'var(--mono)',fontSize:10,fontWeight:700,color:'var(--text3)',marginLeft:10,letterSpacing:'.4px'}}>vs WEEK LOAD</span>}</div>
                <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',display:'block',margin:'4px 0 6px'}}>
                  {wkD.map((p,i)=>{const x=X(p.ts);const y=Ywk(p.val);

                  {tD.map((p,i)=>(<circle key={'t'+i} cx={X(p.ts)} cy={Ytendon(p.val)} r="3.5" fill="#ef4444"/>))}

                {tD.length<2?<div style={{fontSize:12,color:'var(--text3)',fontWeight:600,padding:'0 0 8px'}}>Logs from the Šľachy slider each session.</div>

              </div>
            </>);
          })()}
          {(()=>{
            let sess=null;for(let i=sw.length-1;i>=0&&!sess;i--){const ad=sw[i].athletes[activeAth];const sp=[];
              Object.keys(ad.sets||{}).forEach(eid=>{const bx=baseExId(eid);if(bx.includes('overspeed')||bx.includes('resisted'))return;
                (ad.sets[eid]||[]).forEach(s=>{if(!s.completed||s.warmup)return;FLY.forEach(m=>{const t=Number(s.values&&s.values[m]);if(t>0)sp.push(t)})})});
              if(sp.length>=2)sess=sp}
            if(!sess)return null;
            const best=Math.min(...sess);const bestIdx=sess.indexOf(best);const thr=best*1.04;
            const decayN=sess.filter((t,i)=>i>bestIdx&&t>thr).length;
            return(<>
              <div className="s-title">Session Velocity Decay</div>
              <div style={{margin:'0 14px',display:'flex',gap:4,alignItems:'flex-end',height:92}}>
                {sess.map((t,i)=>(<div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
                  <div style={{width:'100%',height:Math.max(16,90-(t-best)/best*900),borderRadius:5,background:t===best?'var(--green)':(i>bestIdx&&t>thr)?'var(--red)':'var(--surface3)'}}/>
                  <span style={{fontFamily:'var(--mono)',fontSize:8,fontWeight:700,color:'var(--text3)'}}>{t.toFixed(2)}</span>
                </div>))}
              </div>
              <div className="prd-meta" style={{margin:'6px 14px 0'}}>{decayN>0?decayN+' rep'+(decayN>1?'s':'')+' dropped more than 4% off after your fastest 10m — fatigue set in, that was the point to stop.':'No decay — you held speed all the way through'+(bestIdx>=sess.length-2?' and peaked at the end.':'.')}</div>
            </>);
          })()}
          {(()=>{
            let ob=null;sw.forEach(w=>{const ad=w.athletes[activeAth];
              Object.keys(ad.sets||{}).filter(k=>baseExId(k)==='overspeed-40m').forEach(k=>{
                (ad.sets[k]||[]).forEach(s=>{if(!s.completed||s.warmup)return;const v=s.values||{};
                  // legacy: derive 10m segments from cumulative splits
                  const segs=[Number(v['split-10m']),Number(v['split-20m'])-Number(v['split-10m']),Number(v['split-30m'])-Number(v['split-20m']),Number(v['split-40m'])-Number(v['split-30m'])].filter(x=>x>0.05);
                  // new: direct fly-10m segments
                  ['fly-10m-1','fly-10m-2','fly-10m-3'].forEach(m=>{const x=Number(v[m]);if(x>0.05)segs.push(x)});
                  if(segs.length){const mn=Math.min(...segs);if(ob==null||mn<ob)ob=mn}})})});
            if(ob==null||maxVel==null)return null;
            const ov=Math.round(1000/ob)/100;const gap=Math.round((ov-maxVel)/maxVel*1000)/10;
            // per-session gap %: smaller gap = transfer is working
            const gapSeries=[];
            sw.forEach(w=>{const ad=w.athletes[activeAth];
              let bestFree=Infinity,bestOv=Infinity;
              Object.keys(ad.sets||{}).forEach(eid=>{const bx=baseExId(eid);
                const isOv=bx.includes('overspeed');if(bx.includes('resisted'))return;
                (ad.sets[eid]||[]).forEach(s=>{if(!s.completed||s.warmup)return;
                  FLY.forEach(m=>{const t=Number(s.values&&s.values[m]);if(t>0){if(isOv){if(t<bestOv)bestOv=t}else{if(t<bestFree)bestFree=t}}});
                  if(isOv){const v=s.values||{};
                    const segs=[Number(v['split-10m']),Number(v['split-20m'])-Number(v['split-10m']),Number(v['split-30m'])-Number(v['split-20m']),Number(v['split-40m'])-Number(v['split-30m'])].filter(x=>x>0.05);
                    ['fly-10m-1','fly-10m-2','fly-10m-3'].forEach(m=>{const x=Number(v[m]);if(x>0.05)segs.push(x)});
                    if(segs.length){const mn=Math.min(...segs);if(mn<bestOv)bestOv=mn}}})});
              if(bestFree<Infinity&&bestOv<Infinity){
                const fV=10/bestFree,oV=10/bestOv;
                const gp=Math.round((oV-fV)/fV*1000)/10;
                if(gp>=0&&gp<50)gapSeries.push(gp)}});
            return(<>
              <div className="s-title">Overspeed Gap</div>
              <div style={{margin:'0 14px',display:'flex',gap:10}}>
                {[['Overspeed',ov,'var(--orange)'],['Free',maxVel,'var(--primary)']].map(([l,v,c])=>(
                  <div key={l} style={{flex:1,background:'var(--surface2)',borderRadius:13,padding:'13px 6px',textAlign:'center'}}>
                    <div style={{fontSize:22,fontWeight:900,fontStyle:'italic',color:c}}>{v}<span style={{fontSize:11,color:'var(--text3)',fontStyle:'normal'}}> m/s</span></div>
                    <div style={{fontSize:11,fontWeight:800,color:'var(--text2)',marginTop:2}}>{l}</div>
                  </div>))}
              </div>
              <div className="prd-meta" style={{margin:'6px 14px 0'}}>{gap}% faster assisted — a shrinking gap means your free speed is catching up.</div>
              {gapSeries.length>=2&&<div style={{margin:'8px 14px 0'}}>
                <div style={{fontFamily:'var(--mono)',fontSize:10,fontWeight:800,color:'var(--text3)',letterSpacing:'.6px',textTransform:'uppercase'}}>Gap Trend · target &lt; 5%</div>
                <TrendChart values={gapSeries} lowerBetter={true} refLines={[{val:5,label:'TARGET 5%',color:'rgba(34,197,94,.7)'}]}/>
              </div>}
            </>);
          })()}
          {(()=>{
            const wk=computeWeekLoad(sw,activeAth);if(!wk)return null;
            const{vals,last,avg,spike,mx}=wk;
            const LO=400,HI=600;
            const barMax=70;// px
            const yFromVal=v=>Math.min(barMax,v/mx*barMax);
            return(<>
              <div className="s-title">Week Load</div>
              <div style={{margin:'0 14px'}}>
                <div style={{display:'flex',gap:5,alignItems:'flex-end',height:barMax+2,position:'relative'}}>
                  {/* 400-600m target zone */}
                  {mx>=LO&&<div style={{position:'absolute',left:0,right:0,bottom:yFromVal(LO)+'px',height:(yFromVal(Math.min(HI,mx))-yFromVal(LO))+'px',background:'rgba(34,197,94,.10)',borderTop:'1px dashed rgba(34,197,94,.5)',borderBottom:'1px dashed rgba(34,197,94,.5)',pointerEvents:'none'}}/>}
                  {vals.slice(-8).map((v,i,a)=>(<div key={i} style={{flex:1,height:Math.max(8,yFromVal(v)),borderRadius:5,background:i===a.length-1&&spike?'var(--red)':'var(--primary)',position:'relative',zIndex:1}}/>))}
                </div>
                <div style={{display:'flex',gap:5,marginTop:3}}>
                  {vals.slice(-8).map((v,i)=>(<span key={i} style={{flex:1,textAlign:'center',fontFamily:'var(--mono)',fontSize:8,fontWeight:700,color:'var(--text3)'}}>{v}</span>))}
                </div>
              </div>
              <div className="prd-meta" style={{margin:'6px 14px 0'}}>{spike?'⚠ This week is '+Math.round((last/avg-1)*100)+'% over your 4-week average — volume spike, injury risk.':'High-intensity metres per week (sprints, approaches, bounds). Shaded band = 400–600 m target.'}</div>
            </>);
          })()}
        </>);
      })()}

      <div className="s-title">Personal Records</div>
      <div className="stat-summary" style={{marginTop:4}}>
        {[[myWk.length,'Sessions'],[d30,'30 Days'],[d7,'This Week']].map(([v,l],i)=>(
          <div key={l} className="stat-cell" style={i?{borderLeft:'1px solid var(--border)'}:{}}>
            <div className="stat-cell-v">{v}</div>
            <div className="stat-cell-l">{l}</div>
          </div>))}
      </div>
      {Object.keys(prMap).length>0&&<div style={{padding:'2px 14px 8px'}}>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search exercises..."
          style={{width:'100%',padding:'13px 16px',border:'none',background:'var(--surface2)',borderRadius:13,fontSize:14,fontWeight:600,color:'var(--text)',fontFamily:'inherit',boxSizing:'border-box'}}/>
      </div>}
      {section('Sprint PBs',sprintIds)}
      {section('Fly PBs',flyIds)}
      {section('Resisted Sprint PBs',resistedIds)}
      {section('Everything Else',otherIds)}

      {Object.keys(prMap).length===0&&<div className="empty"><div className="empty-text">Log a workout to see your records</div></div>}

function CalScreen({workouts,planned,activeAth,onView,athletes,setActiveAth,onAddPlan,onEditPlan,dayTypes,onSetDayType,weekLabels,onSetWeekLabel}){
  const[sel,setSel]=useState(new Date());

  const[labelWeek,setLabelWeek]=useState(null);

  const monthName=m.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const first=new Date(m);first.setDate(1);
  const startDow=(first.getDay()+6)%7;
  const dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  const cells=[];
  for(let i=0;i<startDow;i++)cells.push({dim:true,d:new Date(m.getFullYear(),m.getMonth(),-startDow+i+1)});
  for(let i=1;i<=dim;i++)cells.push({d:new Date(m.getFullYear(),m.getMonth(),i)});
  while(cells.length%7)cells.push({dim:true,d:new Date(m.getFullYear(),m.getMonth()+1,cells.length-dim-startDow+1)});
  const weeks=[];for(let i=0;i<cells.length;i+=7)weeks.push(cells.slice(i,i+7));

          <button onClick={()=>{const n=new Date(m);n.setMonth(n.getMonth()+1);setM(n)}} style={{width:34,height:34,borderRadius:10,background:'var(--surface2)',border:'none',display:'flex',alignItems:'center',justifyContent:'center'}}><Ic n="chevR" s={18}/></button>
        </div>
      </div>
      <div style={{padding:'0 22px'}}>
        <div className="cal-grid">{['M','T','W','T','F','S','S'].map((x,i)=><div key={i} className="cal-day-h">{x}</div>)}</div>
        <div style={{marginBottom:18}}>
          {weeks.map((wk,wi)=>{const wKey=dateKey(wk[0].d.getTime());const lbl=(weekLabels||{})[wKey];
            return(<div key={wi} style={{marginBottom:2}}>
              <button className={'cal-wk'+(lbl?' on':'')} onClick={()=>{setCustom(lbl||'');setLabelWeek(wKey)}}>
                {lbl?<span className="cal-wk-tag">{lbl}</span>:<span className="cal-wk-add">+ week label</span>}
              </button>
              <div className="cal-grid">
                {wk.map(c=>{const k=dateKey(c.d.getTime());
                  const dWk=workouts.find(w=>w.athletes?.[activeAth]&&dateKey(w.startTime)===k);
                  const dPl=(planned||[]).find(p=>p.date===k);
                  const dt=dayTypes?.[k];
                  const isSel=k===selK;
                  const dotColor=dWk?(dWk.color||'var(--green)'):dPl?(dPl.color||'var(--primary)'):null;
                  return(<button key={k} className={'cal-cell'+(c.dim?' dim':'')+(dWk?' has':'')+(k===todayK?' today':'')+(dt==='high'?' dhigh':dt==='low'?' dlow':dt==='off'?' doff':'')}
                    onClick={()=>setSel(new Date(c.d))}
                    style={isSel&&k!==todayK?{background:'var(--surface3)'}:{}}>
                    {c.d.getDate()}{dotColor&&<span className="pdot" style={{background:dotColor}}/>}
                  </button>)})}

      </div>}
      {dayPlans.map(plan=>(<div key={plan.id} className="wcard" style={{margin:'0 14px 10px',cursor:'pointer'}} onClick={()=>onEditPlan&&onEditPlan(plan)}>

// Format one logged set into a bold headline + clean sub-metrics for the history view
function histSet(v){
  const has=k=>v[k]!=null&&v[k]!=='';
  const t2=n=>{const x=Number(n);return Number.isFinite(x)?x.toFixed(2):n;};
  let headKey=null;
  if(has('tf-time'))headKey='tf-time';
  else if(has('time'))headKey='time';
  else if(has('tf-dist'))headKey='tf-dist';
  else if(has('weight'))headKey='weight';
  else if(has('reps'))headKey='reps';
  else if(has('distance'))headKey='distance';
  let lead=null,headline=null;
  if(headKey==='tf-time'||headKey==='time'){headline=t2(v[headKey])+'s';if(has('distance'))lead=v['distance']+'m';}
  else if(headKey==='tf-dist')headline=v['tf-dist']+' m';
  else if(headKey==='weight')headline=v['weight']+' kg'+(has('reps')?' × '+v['reps']:'');
  else if(headKey==='reps')headline=v['reps']+' reps';
  else if(headKey==='distance')headline=v['distance']+' m';
  const subs=[];
  Object.keys(v).forEach(k=>{if(!has(k))return;
    if(k===headKey)return;
    if(k==='reps'&&headKey==='weight')return;
    if(k==='distance'&&lead)return;
    const md=METRIC_MAP[k];
    if(!md)return;
    let lab;
    if(k.startsWith('split-'))lab=k.replace('split-','');
    else if(k.startsWith('fly-'))lab='fly';
    else if(k.startsWith('seg-'))lab=k.replace('seg-','');
    else lab=(md.name||k).toLowerCase();
    subs.push({lab,val:md.unit==='s'?t2(v[k])+'s':v[k]+(md.unit||'')});
  });
  return{lead,headline,subs,nm:headline==null};
}

// === PULL TO REFRESH ===
function PullRefresh(){
  const[pullY,setPullY]=useState(0);const[refreshing,setRefreshing]=useState(false);
  const ref=useRef({y0:0,active:false,didMove:false});const pullRef=useRef(0);
  useEffect(()=>{
    const inActive=()=>{try{return localStorage.getItem('wk2_activeSession')==='1'}catch{return false}};
    const onStart=e=>{if(refreshing||inActive())return;
      const sc=document.querySelector('.scroll');if(sc&&sc.scrollTop>5)return;
      const t=e.touches[0];ref.current={y0:t.clientY,active:true,didMove:false};pullRef.current=0};
    const onMove=e=>{const r=ref.current;if(!r.active)return;
      const t=e.touches[0];const dy=t.clientY-r.y0;
      if(dy<=0){if(r.didMove){r.active=false;setPullY(0);pullRef.current=0}return}
      r.didMove=true;
      const damped=Math.min(dy*0.5,160);pullRef.current=damped;setPullY(damped)};
    const onEnd=async()=>{const r=ref.current;if(!r.active||!r.didMove){setPullY(0);pullRef.current=0;r.active=false;return}
      r.active=false;const dx=pullRef.current;
      if(dx>60){setRefreshing(true);setPullY(50);
        try{if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();
          if(reg)await reg.update();await new Promise(r=>setTimeout(r,300))}}catch{}
        window.location.reload()}
      else{setPullY(0);pullRef.current=0}};
    document.addEventListener('touchstart',onStart,{passive:true});
    document.addEventListener('touchmove',onMove,{passive:true});
    document.addEventListener('touchend',onEnd,{passive:true});
    return()=>{document.removeEventListener('touchstart',onStart);
      document.removeEventListener('touchmove',onMove);
      document.removeEventListener('touchend',onEnd)};
  },[refreshing]);
  if(pullY<3&&!refreshing)return null;
  const rot=pullY*4;
  return(<div style={{position:'fixed',top:0,left:0,right:0,height:60,display:'flex',alignItems:'center',justifyContent:'center',transform:`translateY(${pullY-60}px)`,transition:refreshing?'transform .25s ease':'none',zIndex:200,pointerEvents:'none'}}>
    <div style={{width:30,height:30,borderRadius:'50%',border:'3px solid rgba(0,0,0,.08)',borderTopColor:'var(--primary)',transform:`rotate(${rot}deg)`,animation:refreshing?'spin .8s linear infinite':'none',background:'#fff',boxShadow:'0 2px 10px rgba(0,0,0,.08)'}}/>
  </div>)}

// === ERROR BOUNDARY ===
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null}}
  static getDerivedStateFromError(err){return{err}}
  componentDidCatch(err,info){console.error('Render error:',err,info)}
  render(){if(this.state.err)return(
    <div style={{padding:'40px 20px',color:'#0a0a0b',background:'#fff',height:'100vh',overflow:'auto'}}>
      <h2 style={{fontStyle:'italic',fontWeight:900,fontSize:24,marginBottom:16,textTransform:'uppercase'}}>Render Error</h2>
      <pre style={{fontSize:12,color:'#dc2626',background:'#fef2f2',padding:14,borderRadius:10,whiteSpace:'pre-wrap',marginBottom:14,fontFamily:'JetBrains Mono,monospace'}}>{String(this.state.err?.message||this.state.err)}</pre>
      {this.state.err?.stack&&<pre style={{fontSize:10,color:'#52525b',background:'#f4f4f5',padding:12,borderRadius:8,whiteSpace:'pre-wrap',overflow:'auto',fontFamily:'JetBrains Mono,monospace'}}>{this.state.err.stack}</pre>}
      <button style={{marginTop:18,padding:'14px 18px',background:'#2156f4',color:'#fff',border:'none',borderRadius:12,fontWeight:800}} onClick={()=>{
        try{['wk2_activeSession','wk2_activePlan','wk2_activeSnapshot','wk2_v3_snap'].forEach(k=>localStorage.removeItem(k))}catch{}
        location.reload()}}>Clear active session & reload</button>
    </div>);return this.props.children}}

      'cones-sprint':{id:'cones-sprint',name:'Cones Sprint',category:'T&F',metrics:['reps']},
      'med-ball-throw':{id:'med-ball-throw',name:'Med Ball Throw',category:'T&F',metrics:['weight','reps']},
      'sprint-band-overhead':{id:'sprint-band-overhead',name:'Band Sprint (Overhead)',category:'T&F',metrics:['distance']},
      'sprint-band-front':{id:'sprint-band-front',name:'Band Sprint (In Front)',category:'T&F',metrics:['distance']},
      'no-arm-sprint':{id:'no-arm-sprint',name:'No-Arm Sprint',category:'T&F',metrics:['distance']},
      'approach-tech':{id:'approach-tech',name:'Approach Technique',category:'T&F',metrics:['distance']}
    };
    const have=new Set(exercises.map(e=>e.id));
    const missing=Object.keys(defs).filter(id=>!have.has(id)).map(id=>defs[id]);
    if(missing.length)setExercises(p=>[...p,...missing.filter(m=>!p.find(x=>x.id===m.id))]);
  },[exSynced,exercises.length]);

  // Migration: strip the bulk-dump plan notes - dosage now shows inline per exercise
  useEffect(()=>{const KEY='wk2_v3_fix_notes_2';
    if(localStorage.getItem(KEY)==='1')return;
    if(!plannedSynced)return;
    const fix={'pl-gym-4':'① Ankle Complex · ② Back + Postural Integrity · ③ Posterior Chain','pl-lj-session-3':'Hlavná téma: ARM BLOCK','pl-lj-session-4':''};
    setPlanned(p=>{let changed=false;
      const n=p.map(pl=>{if(Object.keys(fix).includes(pl.id)&&(pl.notes||'')!==fix[pl.id]){changed=true;return{...pl,notes:fix[pl.id]}}return pl});
      return changed?n:p});
    localStorage.setItem(KEY,'1')
  },[plannedSynced,planned]);

  // Migration: strip dosage out of exercise notes - dosage lives in sets/reps, not notes
  useEffect(()=>{const KEY='wk2_v3_fix_exnotes_3';
    if(localStorage.getItem(KEY)==='1')return;
    if(!plannedSynced)return;
    const fix={
      'pl-lj-session-3':{'standing-arm-block':'Pripraviť ARM BLOCK pattern.','short-app-popup':'Cue: ARM BLOCK.','full-app-runthrough':'Freelap + značky check.','full-app-popup':'Freelap + video. Cue: ARM BLOCK.','approach-jump-12':'Z DOSKY. ARM BLOCK - nastaviť.','approach-jump-14':'Z DOSKY. ARM BLOCK - bridge.','approach-jump-16':'Z DOSKY. ARM BLOCK - hlavná práca. Freelap + video.'},
      'pl-lj-session-4':{'standing-lj':'Max effort.','telemark-hold':'Telemark pozícia - výdrž.','lj-box-6step':'Posledné 2 pridať cones.','telemark-switch':'Telemark - výmena nôh.','lj-box-8step':'Klobúčiky.','lj-landing-drill':'Nácvik dopadu.','lj-box-10step':'Posledné 3 ubrať klobúčiky.'},
      'pl-gym-4':{'ankle-isometric':'3 pozície.','calf-ecc-slam':'5s dole, slam board.','tibialis-raise-w':'S váhou.','lower-back-ext-rot':'S rotáciou.','mb-catch-rotational':'Chytiť + rotačný hod.','half-squat-jump-oh':'Váha nad hlavou.','sl-hamstring-rdl':'Hand-to-hand.','leg-press-sl-ecc':'5s dole, excentrika.'}
    };
    setPlanned(p=>{let changed=false;
      const n=p.map(pl=>{if(fix[pl.id]&&JSON.stringify(pl.exNotes||{})!==JSON.stringify(fix[pl.id])){changed=true;return{...pl,exNotes:fix[pl.id]}}return pl});
      return changed?n:p});
    localStorage.setItem(KEY,'1')
  },[plannedSynced,planned]);

  // Migration: give the approach exercises the start-mark metric (first column)
  useEffect(()=>{const KEY='wk2_v3_approach_mark_1';
    if(localStorage.getItem(KEY)==='1')return;
    if(!exSynced||!exercises.length)return;
    setExercises(p=>{let changed=false;
      const n=p.map(e=>{if(MARK_GROUP[e.id]&&!(e.metrics||[]).includes('approach-mark')){
        changed=true;return{...e,metrics:['approach-mark',...(e.metrics||[])]}}return e});
      return changed?n:p});
    localStorage.setItem(KEY,'1')
  },[exSynced,exercises.length]);

  // Migration: hurdle jumps get a height (m) metric alongside reps
  useEffect(()=>{const KEY='wk2_v3_hurdle_height_1';
    if(localStorage.getItem(KEY)==='1')return;
    if(!exSynced||!exercises.length)return;
    setExercises(p=>{let changed=false;
      const n=p.map(e=>{if(e.id==='hurdle-jumps'&&!(e.metrics||[]).includes('height')){
        changed=true;return{...e,metrics:[...(e.metrics||[]),'height']}}return e});
      return changed?n:p});
    localStorage.setItem(KEY,'1')
  },[exSynced,exercises.length]);

  // Migration: 8 Wickets gets a per-set spacing (m) metric for tracking the gap
  useEffect(()=>{const KEY='wk2_v3_wicket_spc_1';
    if(localStorage.getItem(KEY)==='1')return;
    if(!exSynced||!exercises.length)return;
    setExercises(p=>{let changed=false;
      const n=p.map(e=>{if(e.id==='wickets-8'&&!(e.metrics||[]).includes('wicket-spc')){
        changed=true;return{...e,metrics:[...(e.metrics||[]),'wicket-spc']}}return e});
      return changed?n:p});
    localStorage.setItem(KEY,'1')
  },[exSynced,exercises.length]);

  // Migration: add exercises the Performance Factors need
  useEffect(()=>{const KEY='wk2_v3_perf_ex_1';
    if(localStorage.getItem(KEY)==='1')return;
    if(!exSynced||!exercises.length)return;
    const adds=[
      {id:'cmj',name:'CMJ',category:'Legs',metrics:['height']},
      {id:'bounds-5-pr',name:'5 Bounds w Pre-Run',category:'T&F',metrics:['tf-dist']},
      {id:'drop-jump-20cm',name:'Drop Jump 20cm',category:'Legs',metrics:['height','gct']},
      {id:'drop-jump-40cm',name:'Drop Jump 40cm',category:'Legs',metrics:['height','gct']},
    ];
    const have=new Set(exercises.map(e=>e.id));
    const missing=adds.filter(e=>!have.has(e.id));
    if(missing.length)setExercises(p=>[...p,...missing.filter(m=>!p.find(x=>x.id===m.id))]);
    localStorage.setItem(KEY,'1')
  },[exSynced,exercises.length]);

  // Migration: the High Pull already logged every session IS the Hang High Pull
  useEffect(()=>{const KEY='wk2_v3_pull_rename_1';
    if(localStorage.getItem(KEY)==='1')return;
    if(!exSynced||!exercises.length)return;
    setExercises(p=>{let changed=false;
      const n=p.filter(e=>{if(e.id==='hang-high-pull'){changed=true;return false}return true})
        .map(e=>{if(e.id==='high-pull'&&e.name!=='Hang High Pull'){changed=true;return{...e,name:'Hang High Pull'}}return e});
      return changed?n:p});
    localStorage.setItem(KEY,'1')
  },[exSynced,exercises.length]);

  useEffect(()=>{const c=ath?.color||'#2156f4';
    document.documentElement.style.setProperty('--primary',c);
    const dark=c.replace(/^#/,'');const r=parseInt(dark.slice(0,2),16),g=parseInt(dark.slice(2,4),16),b=parseInt(dark.slice(4,6),16);
    document.documentElement.style.setProperty('--primary-dark',`rgb(${Math.max(0,r-30)},${Math.max(0,g-30)},${Math.max(0,b-30)})`);
    document.documentElement.style.setProperty('--primary-dim',`rgba(${r},${g},${b},.1)`);
    document.querySelector('meta[name=theme-color]')?.setAttribute('content','#ffffff');
  },[activeAth,ath?.color]);

  if(inWorkout)return(<ActiveWorkout athletes={athletes} activeAth={activeAth} setActiveAth={setActiveAth}
    exercises={exercises} setExercises={setExercises} workouts={workouts} initialPlan={activePlan}
    onFinish={finishWorkout} onCancel={cancelWorkout} onMinimize={minimizeWorkout} allTags={allTags}/>);

  return(<>
    <PullRefresh/>
    {tab==='today'&&<TodayScreen athletes={athletes} activeAth={activeAth} setActiveAth={setActiveAth}
      workouts={workouts} planned={planned} exercises={exercises} templates={templates}
      onStartPlan={startPlan} onStartEmpty={startEmpty} onView={setViewing}
      onAddPlan={d=>setPlanEdit({date:d||dateKey(Date.now())})}
      onEditPlan={p=>setPlanEdit({plan:p})}
      remoteSession={remoteSession} onResume={resumeRemote}
      selDate={selDate} setSelDate={setSelDate}
      dayTypes={dayTypes} onSetDayType={setDayType}/>}
    {tab==='train'&&<CalScreen athletes={athletes} activeAth={activeAth} setActiveAth={setActiveAth}
      workouts={workouts} planned={planned} onView={setViewing}
      onAddPlan={d=>setPlanEdit({date:d||dateKey(Date.now())})}
      onEditPlan={p=>setPlanEdit({plan:p})}
      dayTypes={dayTypes} onSetDayType={setDayType}
      weekLabels={weekLabels} onSetWeekLabel={setWeekLabel}/>}
    {tab==='stats'&&<StatScreen workouts={workouts} activeAth={activeAth} exercises={exercises} onView={setViewing} onSelectEx={setViewEx} remoteSession={remoteSession} onResume={resumeRemote} athletes={athletes} setActiveAth={setActiveAth} onEditAthlete={setEditAthlete}/>}
    {tab==='pred'&&<PredictionsScreen athletes={athletes} activeAth={activeAth} setActiveAth={setActiveAth} workouts={workouts} onEditAthlete={setEditAthlete}/>}

    {viewing&&<WorkoutDetailModal wk={viewing} athletes={athletes} exercises={exercises} workouts={workouts}
      onClose={()=>setViewing(null)}
      onDelete={id=>setWorkouts(p=>p.filter(w=>w.id!==id))}
      onUpdate={updated=>{setWorkouts(p=>p.map(w=>w.id===updated.id?updated:w));setViewing(updated)}}
      onSaveTemplate={saveTemplate}
      onRepeat={wk=>{const plan={id:'pl-'+uid(),name:wk.name||'Workout',exerciseIds:wk.exerciseIds.map(baseExId),
        supersets:[],setConfigs:{}};wk.exerciseIds.forEach(eid=>{const base=baseExId(eid);
          const ss=Object.values(wk.athletes).flatMap(a=>(a.sets[eid]||[]).filter(s=>s.completed));
          if(ss.length)plan.setConfigs[base]=ss.map(s=>{const cfg={};Object.entries(s.values).forEach(([k,v])=>{if(v!==''&&v!=null)cfg[k]=v});return cfg})});
        setViewing(null);startPlan(plan)}}/>}
    {planEdit&&<PlanModal plan={planEdit.plan} date={planEdit.date} exercises={exercises}
      onSave={savePlan} onDelete={deletePlan} onClose={()=>setPlanEdit(null)}/>}
    {viewEx&&<ExerciseDetail exercise={viewEx} athletes={athletes} activeAth={activeAth} workouts={workouts}
      onClose={()=>setViewEx(null)}
      onUpdateMetrics={(id,m)=>{setExercises(p=>p.map(e=>e.id===id?{...e,metrics:m}:e));setViewEx(e=>({...e,metrics:m}))}}/>}
    {editAthlete&&<EditAthleteModal athlete={editAthlete} onSave={a=>setAthletes(p=>p.map(x=>x.id===a.id?a:x))} onClose={()=>setEditAthlete(null)}/>}

    {tab==='today'&&!minimized&&<button className="fab" onClick={startEmpty}><Ic n="plus" s={22}/></button>}

    {minimized&&<div style={{position:'fixed',left:0,right:0,bottom:'calc(var(--tab-h) + var(--safe-b))',zIndex:28,background:'var(--primary)',color:'#fff',display:'flex',alignItems:'stretch',boxShadow:'0 -4px 16px rgba(0,0,0,.12)'}}>
      <button onClick={resumeWorkout} style={{flex:1,background:'transparent',border:'none',color:'#fff',padding:'13px 6px 13px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <span style={{display:'flex',alignItems:'center',gap:9,fontSize:15,fontWeight:800,fontStyle:'italic'}}>
          <span style={{width:9,height:9,borderRadius:'50%',background:'#fff'}}/>Workout in progress</span>
        <span style={{display:'flex',alignItems:'center',gap:3,fontSize:14,fontWeight:800}}>Resume<Ic n="chevR" s={16}/></span>
      </button>
      <button onClick={()=>{if(window.confirm('Discard the workout in progress?'))cancelWorkout()}}
        style={{background:'transparent',border:'none',borderLeft:'1px solid rgba(255,255,255,.25)',color:'rgba(255,255,255,.85)',padding:'0 18px',display:'flex',alignItems:'center'}}><Ic n="x" s={20}/></button>
    </div>}

    <nav className="tabs">
      {[
        {id:'today',ic:'home',l:'Home'},
        {id:'train',ic:'cal',l:'Training'},
        {id:'stats',ic:'bar',l:'Insights'},
        {id:'pred',ic:'trophy',l:'Predict'},
      ].map(t=>(<button key={t.id} className={'tab'+(tab===t.id?' on':'')} onClick={()=>setTab(t.id)}>
        {t.ath?<div className="tab-ath" style={{background:ath?.color||'var(--surface3)',color:'#fff'}}>{ath?.photo?<img src={ath.photo}/>:initials(ath?.name||'')}</div>
          :<Ic n={t.ic} s={22}/>}
        <span className="lbl">{t.l}</span>
      </button>))}
    </nav>
  </>)}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'})}
</script>
</body>
</html>
