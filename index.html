<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3b82f6">
<title>Workout</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f5f5;--surface:#fff;--surface2:#ebebeb;--surface3:#ddd;
  --primary:#3b82f6;--primary-dark:#2563eb;--primary-dim:rgba(59,130,246,.1);--primary-glow:rgba(59,130,246,.06);
  --danger:#ef4444;--danger-dim:rgba(239,68,68,.08);
  --text:#111827;--text2:#6b7280;--text3:#9ca3af;
  --border:#e5e7eb;--border-light:#f3f4f6;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.06);
  --shadow-lg:0 4px 24px rgba(0,0,0,.1);
  --radius:16px;--radius-sm:12px;
  --safe-b:env(safe-area-inset-bottom,0px);--nav-h:64px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#root{height:100%;display:flex;flex-direction:column}
input,button,select,textarea{font:inherit;color:inherit;border:none;background:none;outline:none}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}

.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen::after{content:'';display:block;height:calc(var(--nav-h) + var(--safe-b) + 16px);flex-shrink:0}
.pad{padding:16px}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;
  padding-top:calc(env(safe-area-inset-top,10px) + 8px);
  background:rgba(245,245,245,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  min-height:52px;position:sticky;top:0;z-index:20}
.hdr-title{font-size:17px;font-weight:800;letter-spacing:-.2px}
.hdr-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:12px;color:var(--text2);flex-shrink:0}
.hdr-btn:active{background:rgba(0,0,0,.06)}
.hdr-btn.primary{color:var(--primary)}
.hdr-time{font-size:15px;font-weight:700;color:var(--text2);font-variant-numeric:tabular-nums;
  background:var(--surface);padding:5px 14px;border-radius:20px;box-shadow:var(--shadow)}

/* Athlete Bar */
.ath-bar{display:flex;gap:20px;padding:8px 20px 12px;overflow-x:auto;scrollbar-width:none;justify-content:center}
.ath-bar::-webkit-scrollbar{display:none}
.ath-item{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:68px}
.ath-avatar{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:20px;border:3px solid transparent;transition:all .25s ease;overflow:hidden}
.ath-avatar.active{box-shadow:0 4px 16px rgba(0,0,0,.15)}
.ath-avatar img{width:100%;height:100%;object-fit:cover}
.ath-name{font-size:11px;color:var(--text3);max-width:64px;text-align:center;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ath-name.active{color:var(--text);font-weight:700}

/* Nav */
.nav{display:flex;background:rgba(255,255,255,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid rgba(0,0,0,.06);padding-bottom:var(--safe-b);position:fixed;bottom:0;left:0;right:0;z-index:30}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 0;color:var(--text3);font-size:10px;font-weight:600;letter-spacing:.3px;transition:color .2s}
.nav-item.active{color:var(--primary)}
.nav-item svg{width:24px;height:24px}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 24px;
  border-radius:var(--radius);font-weight:700;font-size:15px;transition:all .2s;width:100%}
.btn:active{transform:scale(.97);opacity:.9}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;
  box-shadow:0 2px 12px rgba(16,185,129,.3)}
.btn-secondary{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.btn-danger{background:var(--danger-dim);color:var(--danger)}
.btn-ghost{color:var(--primary);font-weight:600}
.btn-sm{padding:10px 16px;font-size:13px;border-radius:var(--radius-sm)}

/* Inputs */
.input{background:var(--border-light);border:2px solid transparent;border-radius:var(--radius-sm);
  padding:14px 16px;font-size:16px;width:100%;color:var(--text);font-weight:500;transition:all .2s}
.input:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 4px var(--primary-dim)}
.input::placeholder{color:var(--text3);font-weight:400}
textarea.input{resize:vertical;min-height:70px;font-size:14px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}

/* ── Today Screen ── */
.greeting{margin-bottom:24px}
.greeting h1{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-bottom:2px}
.greeting p{font-size:14px;color:var(--text2);font-weight:500}

.plan-hero{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
.plan-hero::before{content:'';position:absolute;top:0;left:0;bottom:0;width:5px}
.plan-hero-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:12px}
.plan-hero-name{font-size:22px;font-weight:900;letter-spacing:-.3px;margin-bottom:4px}
.plan-hero-count{font-size:13px;color:var(--text2);font-weight:500;margin-bottom:16px}
.plan-hero-exercises{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.plan-hero-ex{font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px}
.plan-hero-ex::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--primary);flex-shrink:0}

.or-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--text3);font-size:12px;font-weight:600}
.or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border)}

.week-stats{display:flex;gap:16px;padding:14px 16px;background:var(--surface);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:24px}
.week-stat{display:flex;flex-direction:column;align-items:center;flex:1}
.week-stat-val{font-size:20px;font-weight:900;color:var(--primary)}
.week-stat-label{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px}

.card-list{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.wk-card{display:flex;align-items:stretch;background:var(--surface);
  border-bottom:1px solid var(--border-light);transition:background .15s;position:relative;overflow:hidden}
.wk-card:last-child{border-bottom:none}
.wk-card:active{background:var(--border-light)}
.wk-card-bar{width:4px;flex-shrink:0}
.wk-card-body{flex:1;padding:14px 16px;min-width:0}
.wk-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk-card-name{font-size:16px;font-weight:800;letter-spacing:-.3px;color:var(--text1)}
.wk-card-date{font-size:13px;font-weight:700;color:var(--text2);white-space:nowrap}
.wk-card-bottom{display:flex;align-items:center;gap:8px;margin-top:5px}
.wk-card-meta{font-size:13px;color:var(--text2);font-weight:600}
.wk-card-tag{padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;margin-left:auto}
.ex-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);
  border-bottom:1px solid var(--border-light);transition:background .15s;width:100%;text-align:left}
.ex-card:last-child{border-bottom:none}
.ex-card:active{background:var(--border-light)}
.ex-card-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ex-card-info{flex:1;min-width:0}
.ex-card-name{font-size:15px;font-weight:700;letter-spacing:-.2px}
.ex-card-meta{font-size:12px;color:var(--text3);font-weight:500;margin-top:2px;display:flex;gap:4px;align-items:center}

/* ── Readiness ── */
.readiness{position:fixed;inset:0;background:var(--surface);z-index:50;display:flex;flex-direction:column;overflow-y:auto}
.readiness-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;
  padding-top:calc(env(safe-area-inset-top,14px) + 12px);border-bottom:1px solid var(--border)}
.readiness-title{font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2)}
.readiness-skip{color:var(--primary);font-weight:700;font-size:15px;padding:8px 12px;border-radius:8px}
.readiness-body{flex:1;padding:28px 24px}
.readiness-q{margin-bottom:36px}
.readiness-q h3{font-size:18px;font-weight:700;margin-bottom:14px}
.readiness-scale{display:flex;gap:8px}
.readiness-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 4px;
  border-radius:var(--radius-sm);border:2px solid var(--border);transition:all .25s;min-width:0;background:var(--surface)}
.readiness-btn span:first-child{font-size:22px;font-weight:900}
.readiness-btn span:last-child{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;text-align:center;line-height:1.2}
.readiness-btn.sel{border-color:currentColor;background:currentColor}
.readiness-btn.sel span{color:#fff!important}
.r1{color:#ef4444}.r2{color:#f97316}.r3{color:#eab308}.r4{color:#22c55e}.r5{color:#10b981}

/* ── Accordion ── */
.acc{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;transition:all .3s}
.acc.done{opacity:.55;border:2px solid #10b981}
.superset-group{border:2px solid var(--primary);border-radius:calc(var(--radius) + 4px);padding:4px;margin-bottom:12px;position:relative}
.superset-group .acc{margin-bottom:4px;box-shadow:none}
.superset-group .acc:last-child{margin-bottom:0}
.superset-label{position:absolute;top:-10px;left:16px;background:var(--primary);color:#fff;font-size:10px;font-weight:800;
  padding:2px 10px;border-radius:10px;letter-spacing:.5px;text-transform:uppercase}
.superset-unlink{position:absolute;top:-10px;right:16px;background:var(--surface);border:1px solid var(--border-light);
  color:var(--text3);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;cursor:pointer}
.superset-unlink:active{background:var(--border-light)}
.superset-grip{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border-light);
  color:var(--text3);padding:2px 10px;border-radius:10px;cursor:grab;display:flex;align-items:center;touch-action:none}
.link-btn{display:flex;align-items:center;justify-content:center;margin:-4px auto;height:24px;width:24px;
  border-radius:50%;background:var(--surface);border:1.5px solid var(--border-light);color:var(--text3);
  cursor:pointer;z-index:1;position:relative;transition:all .15s}
.link-btn:active{background:var(--primary);border-color:var(--primary);color:#fff}
.acc-hdr{display:flex;align-items:center;padding:16px 18px;gap:12px}
.acc-hdr-info{flex:1;min-width:0}
.acc-hdr-name{font-weight:800;font-size:16px;color:var(--primary);letter-spacing:-.2px}
.acc-hdr-sub{font-size:12px;color:var(--text3);margin-top:2px;display:flex;gap:10px;font-weight:500}
.acc-chevron{color:var(--text3);transition:transform .25s;flex-shrink:0}
.acc-chevron.open{transform:rotate(180deg)}
.acc-body{border-top:1px solid var(--border);animation:accIn .25s ease}
@keyframes accIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

.ex-actions{display:flex;gap:4px;padding:8px 14px;border-bottom:1px solid var(--border-light);background:var(--border-light)}
.ex-act-btn{padding:7px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text2);
  display:flex;align-items:center;gap:4px;white-space:nowrap}
.ex-act-btn:active{background:rgba(0,0,0,.06)}
.ex-act-btn.danger{color:var(--danger)}

/* Set Table */
.set-table{padding:6px 12px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.set-row{display:grid;align-items:center;gap:6px;padding:5px 4px;border-radius:10px;min-height:44px}
.set-row.header{color:var(--text3);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;min-height:28px;line-height:1.2}
.set-row.completed{background:var(--primary-glow)}
.set-num{font-weight:800;font-size:13px;color:var(--text3);text-align:center;width:24px}
.set-prev{font-size:11px;color:var(--text3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.set-input{background:var(--border-light);border:2px solid transparent;border-radius:8px;padding:9px 4px;
  text-align:center;font-size:16px;font-weight:700;width:100%;min-width:0;transition:all .2s}
.set-input:focus{border-color:var(--primary);background:var(--surface)}
.set-input::placeholder{color:var(--text3);font-weight:400;font-size:12px}
.set-check{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--border-light);color:var(--text3);transition:all .2s;flex-shrink:0}
.set-check.done{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(16,185,129,.3)}
.set-check:active{transform:scale(.88)}
.add-set-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;
  color:var(--primary);font-size:13px;font-weight:700;width:100%;border-top:1px solid var(--border-light)}
.add-set-btn:active{background:var(--primary-dim)}

/* Rest Timer */
.rest-bar{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--safe-b) + 8px);
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:25;
  animation:slideUp .35s cubic-bezier(.16,1,.3,1);overflow:hidden}
@keyframes slideUp{from{transform:translateY(120%);opacity:0}to{transform:translateY(0);opacity:1}}
.rest-bar-progress{position:absolute;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--primary),var(--primary-dark));transition:width 1s linear}
.rest-bar-content{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
.rest-bar-time{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--primary)}
.rest-bar-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.rest-bar-actions{display:flex;gap:8px}
.rest-btn{padding:8px 14px;border-radius:10px;background:var(--border-light);color:var(--text2);font-size:14px;font-weight:700}
.rest-btn:active{background:var(--surface3)}
.rest-btn.skip{color:var(--primary);background:var(--primary-dim)}

/* Modals */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  z-index:40;display:flex;align-items:flex-end;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-height:92vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;animation:modalUp .35s cubic-bezier(.16,1,.3,1);padding-bottom:var(--safe-b)}
@keyframes modalUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-title{font-size:18px;font-weight:800}
.modal-body{padding:20px}

/* Picker & Forms */
.search-bar{position:relative;margin-bottom:14px}
.search-bar .input{padding-left:42px}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3)}
.cat-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.cat-chips::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--border-light);color:var(--text2);transition:all .2s}
.chip.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(16,185,129,.25)}
.ex-list-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border-light)}
.ex-list-item:last-child{border-bottom:none}
.ex-list-item:active{background:var(--border-light)}
.ex-list-name{font-weight:700;font-size:15px}
.ex-list-cat{font-size:12px;color:var(--text3);margin-top:2px;font-weight:500}
.ex-list-metrics{font-size:11px;color:var(--text3);margin-top:2px}
.metric-tag{display:inline-flex;padding:7px 14px;background:var(--border-light);border:2px solid transparent;
  border-radius:20px;font-size:13px;font-weight:600;margin:3px;transition:all .2s}
.metric-tag.selected{background:var(--primary-dim);border-color:var(--primary);color:var(--primary)}
.form-group{margin-bottom:18px}
.form-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:8px;display:block}
.form-row{display:flex;gap:10px}
.select-wrap select{appearance:none;background:var(--border-light);border:2px solid transparent;
  border-radius:var(--radius-sm);padding:14px 34px 14px 16px;font-size:16px;width:100%;color:var(--text);font-weight:500}
.select-wrap{position:relative}.select-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}

/* Calendar */
.cal-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;margin-bottom:10px}
.cal-hdr-title{font-size:17px;font-weight:800}
.cal-hdr-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--text2)}
.cal-hdr-btn:active{background:var(--border-light)}
.cal-day-names{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;
  color:var(--text3);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:12px;font-size:14px;font-weight:600;position:relative;min-height:42px}
.cal-cell:active{background:var(--border-light)}
.cal-cell.today{font-weight:900;color:#fff;background:var(--primary);border-radius:50%}
.cal-cell.comp{font-weight:900;color:#f59e0b;background:rgba(245,158,11,.12);border-radius:50%}
.cal-cell.comp.today{color:#fff;background:linear-gradient(135deg,var(--primary),#f59e0b)}
.cal-dots{display:flex;gap:3px;margin-top:2px;position:absolute;bottom:3px}
.cal-dot{width:5px;height:5px;border-radius:50%}

/* PRs & Stats */
.pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.pr-card{background:var(--border-light);border-radius:var(--radius);padding:16px}
.pr-val{font-size:22px;font-weight:900;color:var(--primary)}
.pr-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:4px;font-weight:700}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.summary-stat{background:var(--border-light);border-radius:var(--radius);padding:16px;text-align:center}
.summary-val{font-size:24px;font-weight:900;color:var(--primary)}
.summary-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:4px;font-weight:700}

/* Weather & Color pickers */
.weather-picker{display:flex;gap:10px;margin-bottom:20px}
.weather-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;
  border-radius:var(--radius);background:var(--border-light);font-size:13px;font-weight:700;color:var(--text2)}
.weather-btn.active{background:var(--primary-dim);color:var(--primary);box-shadow:inset 0 0 0 2px var(--primary)}
.weather-btn .emoji{font-size:28px}
.color-dots{display:flex;gap:10px;flex-wrap:wrap}
.color-dot{width:34px;height:34px;border-radius:50%;border:3px solid transparent;transition:all .2s;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.color-dot.active{border-color:var(--text);transform:scale(1.15)}
.rpe-scale{display:flex;gap:6px;flex-wrap:wrap}
.rpe-btn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;background:var(--border-light);color:var(--text2);transition:all .2s}
.rpe-btn.sel{background:var(--primary);color:#fff}

/* Profile */
.profile-hero{text-align:center;padding:28px 20px 20px;margin-bottom:12px}
.profile-avatar{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:28px;margin:0 auto 14px;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.profile-photo{width:80px;height:80px;border-radius:50%;object-fit:cover;margin:0 auto 14px;display:block;
  box-shadow:0 4px 20px rgba(0,0,0,.12)}
.profile-name{font-size:24px;font-weight:900;letter-spacing:-.4px}
.profile-stats{font-size:13px;color:var(--text2);font-weight:500;margin-top:4px}
.menu-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  background:var(--surface);border-bottom:1px solid var(--border-light);transition:background .15s;width:100%;text-align:left}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:var(--border-light)}
.menu-item-left{display:flex;align-items:center;gap:14px}
.menu-item-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu-item-label{font-weight:700;font-size:15px;letter-spacing:-.2px}
.menu-item-sub{font-size:12px;color:var(--text3);font-weight:500;margin-top:1px}
.menu-item-right{color:var(--text3);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}

.detail-ex{padding:10px 0;border-bottom:1px solid var(--border-light)}
.detail-ex:last-child{border-bottom:none}
.detail-ex-name{font-weight:800;color:var(--primary);margin-bottom:4px;font-size:15px}
.detail-set{display:flex;gap:12px;font-size:14px;color:var(--text2);padding:3px 0;font-weight:500}
.detail-set-num{color:var(--text3);width:20px;font-weight:700}

.confirm-body{text-align:center;padding:28px 24px}
.confirm-body h3{font-size:18px;font-weight:800;margin-bottom:8px}
.confirm-body p{color:var(--text2);margin-bottom:24px;font-size:15px}
.confirm-actions{display:flex;gap:10px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 28px;color:var(--text3);text-align:center}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty-text{font-size:16px;margin-bottom:20px;font-weight:500}
.section-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:10px;padding:0 4px}
.finish-screen{position:fixed;inset:0;background:var(--surface);z-index:50;display:flex;flex-direction:column;overflow-y:auto}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:8px}

/* Date Strip */
.date-strip{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.date-strip-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px}
.date-strip-month{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px;cursor:pointer}
.date-strip-month .chev{transition:transform .25s;color:var(--text3);font-size:12px}
.date-strip-month .chev.open{transform:rotate(180deg)}
.date-strip-today{font-size:11px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;
  padding:4px 10px;border-radius:20px;border:1.5px solid var(--primary);background:none;cursor:pointer}
.date-strip-today:active{background:var(--primary-dim)}
.date-strip-days{display:flex;padding:4px 8px 10px;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.date-strip-days::-webkit-scrollbar{display:none}
.date-strip-day{display:flex;flex-direction:column;align-items:center;min-width:44px;padding:6px 4px 4px;
  border-radius:12px;cursor:pointer;flex-shrink:0;position:relative}
.date-strip-day.active{background:var(--primary);color:#fff}
.date-strip-day.active .ds-label,.date-strip-day.active .ds-num{color:#fff}
.ds-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-bottom:2px}
.ds-num{font-size:17px;font-weight:800;color:var(--text1)}
.ds-dot{width:5px;height:5px;border-radius:50%;background:var(--primary);margin-top:3px}
.date-strip-day.active .ds-dot{background:rgba(255,255,255,.7)}
.cal-body{background:var(--surface);border-radius:0 0 var(--radius) var(--radius);box-shadow:var(--shadow);
  padding:4px 16px 16px;margin-bottom:16px;margin-top:-4px}

/* Competition cards */
.comp-upcoming{padding:14px 16px;background:var(--surface);
  border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:14px;transition:background .15s}
.comp-upcoming:last-child{border-bottom:none}
.comp-upcoming:active{background:var(--border-light)}
.comp-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.comp-info{flex:1;min-width:0}
.comp-title{font-size:15px;font-weight:700}
.comp-sub{font-size:12px;color:var(--text2);font-weight:500;margin-top:1px}
.comp-days{font-size:12px;font-weight:700;white-space:nowrap;padding:4px 10px;border-radius:8px}

/* Drag reorder */
.acc.dragging{opacity:.5;transform:scale(.97);transition:all .15s}
.acc.drag-over{border-top:3px solid var(--primary);margin-top:-3px}
.drag-handle{display:flex;align-items:center;justify-content:center;width:28px;color:var(--text3);
  touch-action:none;cursor:grab;flex-shrink:0;padding:4px 0}
.drag-handle:active{cursor:grabbing}
.drag-handle svg{pointer-events:none}
.ex-stats{display:flex;gap:4px;padding:10px 14px;border-top:1px solid var(--border-light);background:var(--bg)}
.ex-stat{flex:1;text-align:center}
.ex-stat-label{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:2px}
.ex-stat-val{font-size:13px;font-weight:700;color:var(--primary)}

/* Velocity Zone */
.vz-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--border-light);
  border-bottom:1px solid rgba(0,0,0,.04);font-size:12px;font-weight:600;color:var(--text2)}
.vz-badge{padding:3px 10px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.3px}

// ── Storage (localStorage + Supabase sync) ──
const st={
  get(k,f){try{const v=localStorage.getItem('wk2_'+k);return v?JSON.parse(v):f}catch{return f}},
  set(k,v){localStorage.setItem('wk2_'+k,JSON.stringify(v));
    if(sb)sb.from('wk_store').upsert({key:k,value:v,updated_at:new Date().toISOString()}).then(()=>{})},
  async pull(k){if(!sb)return null;const{data}=await sb.from('wk_store').select('value').eq('key',k).single();return data?.value??null}
};
function useStore(k,f){const[v,setV]=useState(()=>st.get(k,f));
  const up=useCallback(fn=>{const n=typeof fn==='function'?fn(st.get(k,f)):fn;st.set(k,n);setV(n)},[k]);
  useEffect(()=>{st.pull(k).then(remote=>{if(remote!==null){const local=st.get(k,f);
    if(JSON.stringify(remote)!==JSON.stringify(local)){localStorage.setItem('wk2_'+k,JSON.stringify(remote));setV(remote)}}})},[]);
  return[v,up]}

// ── Helpers ──
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtTime=s=>{const m=Math.floor(Math.abs(s)/60);return`${m}:${(Math.abs(s)%60).toString().padStart(2,'0')}`};
const fmtDur=ms=>{const s=Math.floor(ms/1000);const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);return h?`${h}h ${m}m`:`${m}m`};
const fmtDate=d=>{const dt=new Date(d);const now=new Date();if(dt.toDateString()===now.toDateString())return'Today';
  const y=new Date(now);y.setDate(y.getDate()-1);if(dt.toDateString()===y.toDateString())return'Yesterday';
  const diff=Math.floor((now-dt)/864e5);if(diff<7)return`${diff}d ago`;
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})};
const dateKey=d=>{const dt=new Date(d);return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`};
const WEATHER_MAP={sunny:'☀️',windy:'💨',rainy:'🌧️'};
const fmtWeather=w=>{if(!w)return'';if(Array.isArray(w))return w.map(k=>WEATHER_MAP[k]||'').join('');return WEATHER_MAP[w]||''};
const toggleWeather=(cur,k)=>{const arr=Array.isArray(cur)?[...cur]:cur?[cur]:[];return arr.includes(k)?arr.filter(x=>x!==k):[...arr,k]};
const hasWeather=(cur,k)=>Array.isArray(cur)?cur.includes(k):cur===k;
const getMetric=(id,cm)=>BUILTIN_METRICS.find(m=>m.id===id)||(cm||[]).find(m=>m.id===id)||{id,name:id,unit:'',step:1};
async function fetchTemp(){try{const pos=await new Promise((ok,fail)=>navigator.geolocation.getCurrentPosition(ok,fail,{timeout:5000}));
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current=temperature_2m`);
  const d=await r.json();return Math.round(d.current.temperature_2m)}catch{return null}}
const initials=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const greeting=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'};
const fullDate=()=>new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const hexRgb=h=>{const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return{r,g,b}};
const applyTheme=color=>{const{r,g,b}=hexRgb(color);const s=document.documentElement.style;
  s.setProperty('--primary',color);s.setProperty('--primary-dark',`rgb(${Math.max(0,r-30)},${Math.max(0,g-30)},${Math.max(0,b-30)})`);
  s.setProperty('--primary-dim',`rgba(${r},${g},${b},.1)`);s.setProperty('--primary-glow',`rgba(${r},${g},${b},.06)`)};

function baseExId(id){return id.replace(/__\d+$/,'')}
function getPrevSets(exId,athId,workouts){
  const base=baseExId(exId);
  for(let i=workouts.length-1;i>=0;i--){const a=workouts[i].athletes?.[athId];if(!a)continue;
    const k=Object.keys(a.sets||{}).find(k=>baseExId(k)===base&&a.sets[k]?.length>0);
    if(k)return a.sets[k]}return null}

const TIME_METRICS=['tf-time','split-10m','split-20m','time'];
const DIST_METRICS=['tf-dist','distance','height'];
function computePRs(exId,athId,workouts,exercise){
  const prs={};if(!exercise)return prs;const base=baseExId(exId);
  workouts.forEach(w=>{const ad=w.athletes?.[athId];if(!ad)return;Object.keys(ad.sets||{}).filter(k=>baseExId(k)===base).forEach(k=>{(ad.sets[k]||[]).filter(s=>s.completed).forEach(s=>{
    const hw=exercise.metrics.includes('weight'),hr=exercise.metrics.includes('reps');
    if(hw&&(s.values.weight||0)>(prs.maxWeight||0))prs.maxWeight=s.values.weight;
    if(hr&&(s.values.reps||0)>(prs.maxReps||0))prs.maxReps=s.values.reps;
    if(hw&&hr){const e1=(s.values.weight||0)*(1+(s.values.reps||0)/30);if(e1>(prs.e1rm||0))prs.e1rm=Math.round(e1*10)/10;
      const vol=(s.values.weight||0)*(s.values.reps||0);if(vol>(prs.maxVol||0))prs.maxVol=vol}
    exercise.metrics.forEach(mid=>{const v=Number(s.values[mid]);if(!v)return;
      if(TIME_METRICS.includes(mid)){if(!prs[mid]||v<prs[mid])prs[mid]=v}
      else if(DIST_METRICS.includes(mid)){if(!prs[mid]||v>prs[mid])prs[mid]=v}});
  })})});return prs}

function computeSprintPRs(exId,athId,workouts){
  const byKey={};const base=baseExId(exId);
  workouts.forEach(w=>{const ad=w.athletes?.[athId];if(!ad)return;Object.keys(ad.sets||{}).filter(k=>baseExId(k)===base).forEach(k=>{(ad.sets[k]||[]).filter(s=>s.completed).forEach(s=>{
    const dist=Number(s.values.distance)||0;if(!dist)return;
    const time=Number(s.values['tf-time']);if(!time)return;
    const eg=s.values['eg-setting'];
    const key=eg?`${dist}m @ EG#${eg}`:`${dist}m`;
    const entry={time,dist,eg:eg||null,splits:{},date:w.startTime,wkName:w.name||'Workout'};

function fmtLast(prevSets,exercise){
  if(!prevSets?.length)return'-';const done=prevSets.filter(s=>Object.values(s.values).some(v=>v!==''&&v!=null));
  if(!done.length)return'-';
  const allMids=[...new Set(done.flatMap(s=>Object.keys(s.values).filter(k=>s.values[k]!==''&&s.values[k]!=null)))];
  const hw=allMids.includes('weight'),hr=allMids.includes('reps');
  if(hw&&hr&&allMids.length===2){const reps=done.map(s=>s.values.reps).filter(v=>v!=null&&v!=='');
    const wts=done.map(s=>s.values.weight).filter(v=>v!=null&&v!=='');
    if(!reps.length||!wts.length)return'-';
    const allR=reps.every(r=>r===reps[0]),allW=wts.every(w=>w===wts[0]);
    if(allR&&allW)return`${done.length}×${reps[0]} @ ${wts[0]}kg`;
    return reps.join(', ')+' @ '+wts.join(', ')+'kg'}
  if(allMids.length<=2){return done.map(s=>allMids.map(mid=>s.values[mid]??'-').join('×')).join(', ')}
  return done.map((s,i)=>`Set ${i+1}: `+allMids.map(mid=>{const v=s.values[mid];
    if(v===''||v==null)return null;const m=BUILTIN_METRICS.find(x=>x.id===mid);
    return `${v}${m?.unit||''}`}).filter(Boolean).join(' / ')).join('\n')}

function WorkoutDetail({workout:initWk,athletes,exercises,cm,onClose,onDelete,onUpdate,onRepeat}){
  const[wk,setWk]=useState(JSON.parse(JSON.stringify(initWk)));
  const[selAth,setSelAth]=useState(athletes[0]?.id);
  const[editing,setEditing]=useState(false);
  const[showTagPicker,setShowTagPicker]=useState(false);
  const[ctName,setCtName]=useState('');const[ctColor,setCtColor]=useState('#8b5cf6');
  const[showAddEx,setShowAddEx]=useState(false);
  const dirty=JSON.stringify(wk)!==JSON.stringify(initWk);
  const durMs=wk.endTime?wk.endTime-wk.startTime:0;const durSec=Math.floor(durMs/1000);
  const[editDur,setEditDur]=useState(false);
  const[dH,setDH]=useState(String(Math.floor(durSec/3600)));
  const[dM,setDM]=useState(String(Math.floor((durSec%3600)/60)));
  const[dS,setDS]=useState(String(durSec%60));
  const dur=editDur?(parseInt(dH||0)*3600+parseInt(dM||0)*60+parseInt(dS||0))*1000:durMs;
  const ad=wk.athletes?.[selAth];
  const totalSets=wk.exerciseIds.reduce((a,eid)=>(a+(ad?.sets?.[eid]||[]).length),0);

  const up=fn=>{const c=JSON.parse(JSON.stringify(wk));const n=fn(c);setWk(n)};
  const setVal=(eid,si,mid,val)=>up(w=>{w.athletes[selAth].sets[eid][si].values[mid]=val===''?val:Number(val);return w});
  const addSet=eid=>up(w=>{const ex=exercises.find(e=>e.id===baseExId(eid));const ns={values:{},completed:true};
    (ex?.metrics||[]).forEach(mid=>{ns.values[mid]=''});w.athletes[selAth].sets[eid].push(ns);return w});
  const delSet=(eid,si)=>up(w=>{w.athletes[selAth].sets[eid].splice(si,1);
    if(!w.athletes[selAth].sets[eid].length){delete w.athletes[selAth].sets[eid];
      w.exerciseIds=w.exerciseIds.filter(id=>id!==eid)}return w});
  const delEx=eid=>up(w=>{w.exerciseIds=w.exerciseIds.filter(id=>id!==eid);
    Object.keys(w.athletes).forEach(aId=>{delete w.athletes[aId].sets[eid]});return w});
  const addExToWk=ex=>{up(w=>{const count=w.exerciseIds.filter(id=>baseExId(id)===ex.id).length;
    const iid=count===0?ex.id:`${ex.id}__${count+1}`;
    w.exerciseIds.push(iid);
    Object.keys(w.athletes).forEach(aId=>{if(!w.athletes[aId].sets)w.athletes[aId].sets={};
      w.athletes[aId].sets[iid]=[{values:{},completed:true}];
      ex.metrics.forEach(mid=>{w.athletes[aId].sets[iid][0].values[mid]=''})});
    return w});setShowAddEx(false)};

  return(<div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}><div className="modal">

      <div style={{display:'flex',gap:4}}>
        <button className="hdr-btn" onClick={()=>setEditing(!editing)}>
          <Icon name={editing?'check':'edit'} size={18}/></button>
        <button className="hdr-btn" onClick={onClose}><Icon name="x" size={20}/></button></div></div>
    <div className="modal-body">
      <AthleteBar athletes={athletes.filter(a=>wk.athletes?.[a.id])} active={selAth} onSelect={setSelAth}/>
      <div style={{textAlign:'center',margin:'12px 0',fontSize:12,color:'var(--text3)',fontWeight:500}}>
        {new Date(wk.startTime).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
        {wk.tempC!=null&&` · ${wk.tempC}°C`}{wk.weather&&` · ${fmtWeather(wk.weather)}`}</div>

      {editing&&<div style={{marginBottom:12}}>
        <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:8}}>
          {DEFAULT_TAGS.map(t=><button key={t.id} onClick={()=>setWk({...wk,tag:wk.tag?.id===t.id?null:t,color:t.color})}
            style={{padding:'5px 12px',borderRadius:20,fontSize:12,fontWeight:700,cursor:'pointer',
              background:wk.tag?.id===t.id?t.color:t.color+'18',color:wk.tag?.id===t.id?'#fff':t.color,
              border:wk.tag?.id===t.id?`2px solid ${t.color}`:'2px solid transparent'}}>{t.name}</button>)}
        </div>
        <div className="weather-picker" style={{justifyContent:'flex-start',gap:6}}>
          {[{k:'sunny',e:'☀️'},{k:'windy',e:'💨'},{k:'rainy',e:'🌧️'}].map(w=>
            <button key={w.k} className={`weather-btn ${hasWeather(wk.weather,w.k)?'active':''}`} style={{padding:'6px 12px',fontSize:13}}
              onClick={()=>{const nw=toggleWeather(wk.weather,w.k);setWk({...wk,weather:nw.length?nw:null})}}>{w.e}</button>)}
        </div></div>}

      <div className="summary-grid">
        <div className="summary-stat" onClick={()=>{if(editing){setEditDur(!editDur)}}} style={{cursor:editing?'pointer':'default'}}>
          {!editDur?<div className="summary-val">{fmtDur(dur)}</div>
            :<div style={{display:'flex',gap:4,alignItems:'center',justifyContent:'center'}}>
              <input type="number" min="0" value={dH} onChange={e=>{setDH(e.target.value);setWk({...wk,endTime:wk.startTime+(parseInt(e.target.value||0)*3600+parseInt(dM||0)*60+parseInt(dS||0))*1000})}}
                style={{width:32,textAlign:'center',fontSize:16,fontWeight:900,background:'var(--bg2)',border:'2px solid var(--primary)',borderRadius:6,padding:'2px',color:'var(--text1)'}}/>
              <span style={{fontWeight:900,color:'var(--text3)'}}>:</span>
              <input type="number" min="0" max="59" value={dM} onChange={e=>{setDM(e.target.value);setWk({...wk,endTime:wk.startTime+(parseInt(dH||0)*3600+parseInt(e.target.value||0)*60+parseInt(dS||0))*1000})}}
                style={{width:32,textAlign:'center',fontSize:16,fontWeight:900,background:'var(--bg2)',border:'2px solid var(--primary)',borderRadius:6,padding:'2px',color:'var(--text1)'}}/>
              <span style={{fontWeight:900,color:'var(--text3)'}}>:</span>
              <input type="number" min="0" max="59" value={dS} onChange={e=>{setDS(e.target.value);setWk({...wk,endTime:wk.startTime+(parseInt(dH||0)*3600+parseInt(dM||0)*60+parseInt(e.target.value||0))*1000})}}
                style={{width:32,textAlign:'center',fontSize:16,fontWeight:900,background:'var(--bg2)',border:'2px solid var(--primary)',borderRadius:6,padding:'2px',color:'var(--text1)'}}/>
            </div>}

      {editing&&ad&&<div style={{marginBottom:12}}>
        <label className="form-label" style={{fontSize:11}}>RPE</label>
        <input type="range" min="1" max="10" value={ad.rpe||5} style={{width:'100%'}}
          onChange={e=>up(w=>{w.athletes[selAth].rpe=Number(e.target.value);return w})}/></div>}
      {ad?.notes&&!editing&&<div style={{padding:12,background:'var(--border-light)',borderRadius:'var(--radius-sm)',marginBottom:14,fontSize:14,color:'var(--text2)'}}>{ad.notes}</div>}
      {editing&&<div style={{marginBottom:14}}><label className="form-label" style={{fontSize:11}}>Notes</label>
        <textarea className="input" value={ad?.notes||''} placeholder="Notes..."
          onChange={e=>up(w=>{w.athletes[selAth].notes=e.target.value;return w})}/></div>}

      {wk.exerciseIds.map((eid,i)=>{const ex=exercises.find(e=>e.id===baseExId(eid));
        const sets=ad?.sets?.[eid]||[];if(!sets.length&&!editing)return null;
        const mds=(ex?.metrics||[]).map(id=>getMetric(id,cm));
        return(<div key={eid} className="detail-ex">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>

          </div>
          {wk.exNotes?.[eid]&&<div style={{fontSize:12,color:'var(--text3)',fontStyle:'italic',marginBottom:4}}>{wk.exNotes[eid]}</div>}
          {!editing?sets.map((s,j)=>(<div key={j} className="detail-set"><span className="detail-set-num">{j+1}</span>
            {mds.map(md=><span key={md.id}>{s.values[md.id]??'-'}{md.unit?` ${md.unit}`:''}</span>)}</div>))

function ExerciseStats({exercise,athletes,workouts,cm,onClose}){
  const[selAth,setSelAth]=useState(athletes[0]?.id);const prs=computePRs(exercise.id,selAth,workouts,exercise);
  const isSprint=exercise.metrics.includes('tf-time')&&exercise.metrics.includes('distance');
  const sprintPRs=isSprint?computeSprintPRs(exercise.id,selAth,workouts):{};
  const hasW=exercise.metrics.includes('weight'),hasR=exercise.metrics.includes('reps');
  const hasTF=exercise.metrics.includes('tf-time');
  const chartMetric=hasTF?'tf-time':hasW?'weight':hasR?'reps':exercise.metrics[0];
  const chartData=getProgressData(exercise.id,selAth,workouts,chartMetric);
  const allMds=[...BUILTIN_METRICS,...cm];
  const mds=exercise.metrics.map(id=>getMetric(id,cm));
  const history=[...workouts].reverse().filter(w=>{const ad=w.athletes?.[selAth];return ad&&Object.keys(ad.sets||{}).some(k=>baseExId(k)===exercise.id&&ad.sets[k]?.some(s=>s.completed))}).slice(0,15);
  return(<div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}><div className="modal">
    <div className="modal-hdr"><span className="modal-title">{exercise.name}</span>
      <button className="hdr-btn" onClick={onClose}><Icon name="x" size={20}/></button></div>
    <div className="modal-body">
      <AthleteBar athletes={athletes} active={selAth} onSelect={setSelAth}/>
      <div style={{marginTop:16}}><div className="section-title">Personal Records</div>
        {isSprint?(<div>{Object.keys(sprintPRs).length?Object.entries(sprintPRs).sort((a,b)=>Number(a[0])-Number(b[0])).map(([dist,pr])=>(
          <div key={dist} style={{background:'var(--bg)',borderRadius:12,padding:'12px 16px',marginBottom:8}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:8}}>
              <div style={{fontSize:18,fontWeight:900,color:'var(--primary)'}}>{dist} — {pr.time}s</div>
              <div style={{fontSize:11,color:'var(--text3)',fontWeight:600}}>{new Date(pr.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div></div>
            {Object.keys(pr.splits).length>0&&<div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
              {Object.entries(pr.splits).map(([k,v])=>{const m=allMds.find(x=>x.id===k);
                return<div key={k} style={{fontSize:13}}><span style={{color:'var(--text3)',fontWeight:600}}>{m?.name||k}:</span>{' '}
                  <span style={{fontWeight:800}}>{v}{m?.unit?' '+m.unit:''}</span></div>})}</div>}
          </div>)):<div style={{padding:16,textAlign:'center',color:'var(--text3)',fontSize:13}}>No data yet</div>}</div>)
        :(<><div className="pr-grid">
          {prs.maxWeight&&<div className="pr-card"><div className="pr-val">{prs.maxWeight} kg</div><div className="pr-label">Max Weight</div></div>}
          {prs.maxReps&&<div className="pr-card"><div className="pr-val">{prs.maxReps}</div><div className="pr-label">Max Reps</div></div>}
          {prs.e1rm&&<div className="pr-card"><div className="pr-val">{prs.e1rm} kg</div><div className="pr-label">Est. 1RM</div></div>}

function WorkoutSummary({workout,athletes,exercises,cm,onClose}){
  const dur=workout.endTime?workout.endTime-workout.startTime:0;
  const d=new Date(workout.startTime);
  const dateStr=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const copyText=()=>{const lines=[workout.name||'Workout',dateStr,fmtDur(dur)+(workout.tempC!=null?' · '+workout.tempC+'°C':''),''];
    athletes.filter(a=>workout.athletes[a.id]).forEach(a=>{
      const ad=workout.athletes[a.id];if(athletes.length>1)lines.push(a.name);
      workout.exerciseIds.forEach(eid=>{const ex=exercises.find(e=>e.id===baseExId(eid));
        const sets=(ad.sets[eid]||[]).filter(s=>s.completed);if(!sets.length)return;
        lines.push('  '+(ex?.name||'?'));
        sets.forEach((s,j)=>{const parts=[];const v=s.values;
          if(v.distance!=null&&v.distance!==''&&v['tf-time']!=null&&v['tf-time']!==''){
            let l=v.distance+'m → '+v['tf-time']+'s';
            const sp=Object.keys(v).filter(k=>k.startsWith('split-')&&v[k]!==''&&v[k]!=null).map(k=>k.replace('split-','')+': '+v[k]);
            if(sp.length)l+=' ('+sp.join(' ')+')';parts.push(l);
          }else{(ex?.metrics||[]).forEach(mid=>{const md=getMetric(mid,cm);const val=v[mid];
            if(val!=null&&val!=='')parts.push(val+(md.unit?' '+md.unit:''))});}
          lines.push('    '+(j+1)+'. '+parts.join(' · '))});
        if(workout.exNotes?.[eid])lines.push('    → '+workout.exNotes[eid])});
      if(ad.rpe)lines.push('  RPE: '+ad.rpe+'/10');if(ad.notes)lines.push('  '+ad.notes);lines.push('')});
    navigator.clipboard?.writeText(lines.join('\n')).then(()=>alert('Copied!'))};
  const c=workout.tag?.color||workout.color||'var(--primary)';
  return(<div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}><div className="modal" style={{maxWidth:400}}>
    <div style={{padding:'24px 20px',background:c+'12',borderBottom:'3px solid '+c}}>
      <div style={{fontSize:22,fontWeight:900,color:'var(--text1)',letterSpacing:'-.5px'}}>{workout.name||'Workout'}</div>
      <div style={{fontSize:13,color:'var(--text2)',marginTop:4,fontWeight:500}}>{dateStr}</div>
      <div style={{display:'flex',gap:12,marginTop:10,fontSize:13,fontWeight:700,color:'var(--text2)'}}>
        <span>{fmtDur(dur)}</span>
        {workout.tempC!=null&&<span>{workout.tempC}°C</span>}
        {workout.weather&&<span>{fmtWeather(workout.weather)}</span>}
      </div>
    </div>
    <div style={{padding:'16px 20px',maxHeight:'50vh',overflow:'auto'}}>
      {athletes.filter(a=>workout.athletes[a.id]).map(a=>{const ad=workout.athletes[a.id];
        return(<div key={a.id} style={{marginBottom:16}}>
          {athletes.length>1&&<div style={{fontSize:14,fontWeight:800,color:a.color,marginBottom:8}}>{a.name}</div>}
          {workout.exerciseIds.map(eid=>{const ex=exercises.find(e=>e.id===baseExId(eid));
            const sets=(ad.sets[eid]||[]).filter(s=>s.completed);if(!sets.length)return null;
            return(<div key={eid} style={{marginBottom:12}}>
              <div style={{fontSize:13,fontWeight:800,color:'var(--text1)',marginBottom:4}}>{ex?.name||'?'}</div>
              {sets.map((s,j)=>{const v=s.values;
                const hasDist=v.distance!=null&&v.distance!=='';const hasTfT=v['tf-time']!=null&&v['tf-time']!=='';
                const hasTfD=v['tf-dist']!=null&&v['tf-dist']!=='';const hasW=v.weight!=null&&v.weight!=='';
                const hasR=v.reps!=null&&v.reps!=='';
                const splits=Object.keys(v).filter(k=>k.startsWith('split-')&&v[k]!==''&&v[k]!=null);
                let primary=null,extra=null;
                if(hasDist&&hasTfT){const extras=[];splits.forEach(k=>extras.push(k.replace('split-','')+': '+v[k]));
                  primary=[<span key="d" style={{fontWeight:800,color:'var(--text1)'}}>{v.distance}m</span>,
                    <span key="a" style={{color:'var(--text3)'}}>→</span>,
                    <span key="t" style={{fontWeight:700,color:c}}>{v['tf-time']}s</span>];
                  if(extras.length)extra=<span key="e" style={{color:'var(--text3)',fontSize:11}}>({extras.join('  ')})</span>;
                }else if(hasTfT){primary=<span style={{fontWeight:800,color:c}}>{v['tf-time']}s</span>;
                }else if(hasTfD){primary=<span style={{fontWeight:800,color:c}}>{v['tf-dist']}m</span>;
                }else if(hasW){primary=[<span key="w" style={{fontWeight:800,color:'var(--text1)'}}>{v.weight}kg</span>];
                  if(hasR)primary.push(<span key="x" style={{color:'var(--text3)'}}>×</span>,<span key="r" style={{fontWeight:700,color:c}}>{v.reps}</span>);
                }else{primary=(ex?.metrics||[]).map(mid=>{const md=getMetric(mid,cm);
                  return<span key={mid} style={{fontWeight:600}}>{v[mid]!=null?v[mid]:'-'}{md.unit?' '+md.unit:''}</span>});}
                return(<div key={j} style={{display:'flex',alignItems:'center',gap:6,fontSize:13,color:'var(--text2)',padding:'1px 0'}}>
                  <span style={{width:16,fontSize:11,fontWeight:700,color:'var(--text3)'}}>{j+1}</span>
                  {primary}{extra}</div>)})}
              {workout.exNotes?.[eid]&&<div style={{fontSize:11,color:'var(--text3)',fontStyle:'italic',marginTop:2}}>{workout.exNotes[eid]}</div>}
            </div>)})}
          {ad.rpe&&<div style={{fontSize:12,fontWeight:700,color:'var(--text3)',marginTop:4}}>RPE: {ad.rpe}/10</div>}
          {ad.notes&&<div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>{ad.notes}</div>}
        </div>)})}
    </div>
    <div style={{padding:'12px 20px',display:'flex',gap:10,borderTop:'1px solid var(--border-light)'}}>
      <button className="btn btn-secondary" style={{flex:1}} onClick={copyText}>📋 Copy</button>
      <button className="btn btn-primary" style={{flex:1}} onClick={onClose}>Done</button>
    </div>
  </div></div>)}

function App(){
  const[tab,setTab]=useState('today');const[inWorkout,setInWorkout]=useState(()=>{try{return localStorage.getItem('wk2_activeSession')==='1'}catch{return false}});const[activePlan,setActivePlan]=useState(()=>{try{const v=localStorage.getItem('wk2_activePlan');return v?JSON.parse(v):null}catch{return null}});
  const[activeAth,setActiveAth]=useState('ath-1');
  const[athletes,setAthletes]=useStore('athletes',DEFAULT_ATHLETES);
  const[exercises,setExercises]=useStore('exercises',DEFAULT_EXERCISES);
  const[cm,setCM]=useStore('customMetrics',[]);
  const[workouts,setWorkouts]=useStore('workouts2',[]);
  const[planned,setPlanned]=useStore('planned2',[]);
  const[competitions,setCompetitions]=useStore('competitions',[]);
  const[viewing,setViewing]=useState(null);const[planDate,setPlanDate]=useState(null);
  const[viewExercise,setViewExercise]=useState(null);const[summaryWk,setSummaryWk]=useState(null);
  useEffect(()=>{if(!inWorkout){const a=athletes.find(a=>a.id===activeAth);applyTheme(a?.color||'#3b82f6')}},[activeAth,athletes,inWorkout]);
  useEffect(()=>{const ids=new Set(exercises.map(e=>e.id));
    const missing=DEFAULT_EXERCISES.filter(e=>!ids.has(e.id));
    const defMap=Object.fromEntries(DEFAULT_EXERCISES.map(e=>[e.id,e]));
    const updated=exercises.map(e=>{const d=defMap[e.id];if(!d||e.isCustom)return e;
      if(d.name!==e.name||JSON.stringify(d.metrics)!==JSON.stringify(e.metrics))return{...e,name:d.name,metrics:d.metrics};return e});
    const changed=updated.some((e,i)=>e!==exercises[i]);
    const cleaned=(changed?[...updated,...missing]:[...exercises,...missing]).filter(e=>e.id!=='contrast-free');
    if(missing.length||changed||exercises.some(e=>e.id==='contrast-free'))setExercises(cleaned)},[]);
  useEffect(()=>{if(!workouts.some(w=>w.exerciseIds?.includes('contrast-free')))return;
    setWorkouts(prev=>prev.map(w=>{if(!w.exerciseIds?.includes('contrast-free'))return w;
      const nw={...w,exerciseIds:[...w.exerciseIds],athletes:{...w.athletes}};
      Object.keys(nw.athletes).forEach(aId=>{const a={...nw.athletes[aId],sets:{...nw.athletes[aId].sets}};
        if(a.sets['contrast-free']){const existing=a.sets['free-sprint']||[];
          a.sets['free-sprint']=[...existing,...a.sets['contrast-free']];delete a.sets['contrast-free']}
        nw.athletes[aId]=a});
      const idx=nw.exerciseIds.indexOf('contrast-free');
      if(idx>=0){if(!nw.exerciseIds.includes('free-sprint'))nw.exerciseIds[idx]='free-sprint';
        else nw.exerciseIds.splice(idx,1)}
      return nw}))},[]);
  useEffect(()=>{const photoMap={};DEFAULT_ATHLETES.forEach(da=>{if(da.photo)photoMap[da.id]=da.photo});
    if(athletes.some(a=>photoMap[a.id]&&!a.photo))setAthletes(prev=>prev.map(a=>photoMap[a.id]&&!a.photo?{...a,photo:photoMap[a.id]}:a))},[]);
  useEffect(()=>{setPlanned(p=>p.filter(x=>!x.id.startsWith('pl-sprint-')));
    if(!planned.find(p=>p.id==='pl-sprint-5')){
    setPlanned(p=>[...p,{id:'pl-sprint-5',date:'2026-04-25',name:'Sprint Training',color:'#06b6d4',
      exerciseIds:['wall-drills','falling-starts','eg-marches','waterbag-sprint','resisted-sprint','free-sprint',
        'mb-overhead-back','mb-chest-pass','mb-rotational'],
      supersets:[['resisted-sprint','free-sprint']],
      setConfigs:{
        'wall-drills':[{reps:8},{reps:8},{reps:8}],
        'falling-starts':[{reps:5},{reps:5},{reps:5},{reps:5},{reps:5}],
        'eg-marches':[{distance:20},{distance:20},{distance:20}],
        'waterbag-sprint':[{distance:10},{distance:10},{distance:10}],
        'resisted-sprint':[{distance:20},{distance:20},{distance:20}],
        'free-sprint':[{distance:20},{distance:25},{distance:30},{distance:30},{distance:30},{distance:30}],
        'mb-overhead-back':[{reps:5}],
        'mb-chest-pass':[{reps:5}],
        'mb-rotational':[{reps:5}]
      },
      notes:'Contrast: Resisted 20m → Free 20m/25m/30m (4 min rest). Free sprints 3×30m (5 min rest). Freelap on free sprints.'
    }]);}
    if(!planned.find(p=>p.id==='pl-lj-drills-1')){
    setPlanned(p=>[...p,{id:'pl-lj-drills-1',date:'2026-04-26',name:'LJ Drills',color:'#8b5cf6',
      exerciseIds:['ankle-dribble','calf-dribble','knee-dribble','free-leg-a-skip',
        'continuous-takeoffs','stride-long-short','3-step-drill','box-ground-box','skipping-height',
        'hj-mat-popup','build-ups','heel-drops','tibialis-raise'],
      supersets:[],
      setConfigs:{
        'ankle-dribble':[{distance:20},{distance:20}],
        'calf-dribble':[{distance:20},{distance:20}],
        'knee-dribble':[{distance:20},{distance:20}],
        'free-leg-a-skip':[{distance:20},{distance:20}],
        'continuous-takeoffs':[{distance:40},{distance:40},{distance:40}],
        'stride-long-short':[{},{},{},{},{},{},{},{}],
        '3-step-drill':[{},{},{},{},{},{}],
        'box-ground-box':[{},{},{},{},{},{}],
        'skipping-height':[{distance:20},{distance:20},{distance:20}],
        'hj-mat-popup':[{},{},{},{},{},{}],
        'build-ups':[{distance:60},{distance:60},{distance:60}],
        'heel-drops':[{reps:15},{reps:15}],
        'tibialis-raise':[{reps:15},{reps:15}]
      },
      notes:'Sprint drills → LJ drills → Pop-ups (HJ mat, 4-6 krokov) → Rovinky 70% → Prevencia'
    }])}
    },[]);

  const _clearActiveSession=()=>{['activeSession','activePlan','activeWorkout','activeSupersets','activeCheckedIn'].forEach(k=>{try{localStorage.removeItem('wk2_'+k)}catch{}})};
  const finishWorkout=(wk,localEx,localCM)=>{_clearActiveSession();
    if(wk.exerciseIds.length>0){setWorkouts(p=>[...p,wk]);setSummaryWk(wk)}
    if(activePlan)setPlanned(p=>p.filter(pl=>pl.id!==activePlan.id));
    setExercises(localEx);setCM(localCM);setInWorkout(false);setActivePlan(null);setTab('today')};
  const cancelWorkout=()=>{_clearActiveSession();setInWorkout(false);setActivePlan(null);setTab('today')};
  const deleteWorkout=id=>{setWorkouts(p=>p.filter(w=>w.id!==id));setViewing(null)};
  const startPlan=plan=>{_clearActiveSession();try{localStorage.setItem('wk2_activePlan',JSON.stringify(plan));localStorage.setItem('wk2_activeSession','1')}catch{};setActivePlan(plan);setInWorkout(true)};
  const startEmpty=()=>{_clearActiveSession();try{localStorage.setItem('wk2_activeSession','1')}catch{};setInWorkout(true)};
  const repeatWorkout=wk=>{const plan={id:'pl-'+uid(),name:wk.name||'Workout',exerciseIds:wk.exerciseIds.map(baseExId),
    supersets:[],setConfigs:{}};wk.exerciseIds.forEach(eid=>{const base=baseExId(eid);
    const sets=Object.values(wk.athletes).flatMap(a=>(a.sets[eid]||[]).filter(s=>s.completed));
    if(sets.length)plan.setConfigs[base]=sets.map(s=>{const cfg={};Object.entries(s.values).forEach(([k,v])=>{if(v!==''&&v!=null)cfg[k]=v});return cfg})});
    setViewing(null);startPlan(plan)};

  if(inWorkout)return(<div id="root" style={{height:'100%',display:'flex',flexDirection:'column'}}>
    <ActiveWorkoutScreen athletes={athletes} exercises={exercises} customMetrics={cm}
      workouts={workouts} onFinish={finishWorkout} onCancel={cancelWorkout} initialPlan={activePlan}/></div>);

  return(<>
    {tab==='today'&&<TodayScreen athletes={athletes} activeAth={activeAth} onSelectAth={setActiveAth}
      workouts={workouts} planned={planned} exercises={exercises} competitions={competitions}
      onStartEmpty={startEmpty} onStartPlan={startPlan} onView={setViewing}/>}
    {tab==='calendar'&&<CalendarScreen workouts={workouts} planned={planned} exercises={exercises}
      competitions={competitions} onView={setViewing}/>}
    {tab==='progress'&&<ProgressScreen workouts={workouts} athletes={athletes} activeAth={activeAth}
      exercises={exercises} cm={cm} competitions={competitions} onView={setViewing} onViewExercise={setViewExercise}/>}
    {tab==='profile'&&<ProfileScreen athletes={athletes} activeAth={activeAth} onSelectAth={setActiveAth}
      exercises={exercises} cm={cm} workouts={workouts} onUpdateAthletes={setAthletes}
      onUpdateExercises={setExercises} onUpdateCM={setCM}
      competitions={competitions} onUpdateCompetitions={setCompetitions}/>}

    <nav className="nav">
      {[{id:'today',icon:'home',l:'Today'},{id:'calendar',icon:'calendar',l:'Calendar'},{id:'progress',icon:'barChart',l:'Progress'},{id:'profile',icon:'user',l:'Profile'}
      ].map(t=>(<button key={t.id} className={`nav-item ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>
        <Icon name={t.icon} size={24}/><span>{t.l}</span></button>))}</nav>

    {viewing&&<WorkoutDetail workout={viewing} athletes={athletes} exercises={exercises} cm={cm}
      onClose={()=>setViewing(null)} onDelete={deleteWorkout}
      onUpdate={wk=>{setWorkouts(p=>p.map(w=>w.id===wk.id?wk:w));setViewing(wk)}}
      onRepeat={repeatWorkout}/>}
    {summaryWk&&<WorkoutSummary workout={summaryWk} athletes={athletes} exercises={exercises} cm={cm}
      onClose={()=>setSummaryWk(null)}/>}
    {planDate&&<PlanWorkoutModal date={planDate} exercises={exercises}
      onSave={p=>{setPlanned(prev=>[...prev,p]);setPlanDate(null)}} onClose={()=>setPlanDate(null)}/>}
    {viewExercise&&<ExerciseStats exercise={viewExercise} athletes={athletes} workouts={workouts} cm={cm}
      onClose={()=>setViewExercise(null)}/>}
  </>)}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
  navigator.serviceWorker.addEventListener('controllerchange',()=>window.location.reload());
}
let _lastHash=null;
document.addEventListener('visibilitychange',async()=>{if(document.hidden)return;
  try{const r=await fetch('./index.html',{cache:'no-store'});const t=await r.text();
    const h=t.length+'_'+t.slice(0,500).length;
    if(_lastHash&&h!==_lastHash)window.location.reload();_lastHash=h}catch{}});
</script>
</body>
</html>
