function ExerciseDetail({exercise,athletes,activeAth,workouts,cm,onClose,onUpdateMetrics}){
  const[selAth,setSelAth]=useState(activeAth);const[tab,setTab]=useState('history');
  const[showEdit,setShowEdit]=useState(false);
  const base=exercise.id;
  const hasW=exercise.metrics.includes('weight');const hasR=exercise.metrics.includes('reps');const hasT=exercise.metrics.includes('tf-time')||exercise.metrics.includes('time');
  // PR computation
  let maxW=0,maxWDate=0,bestT=Infinity,bestTDate=0,bestTDist=null,e1rm=0,e1rmDate=0;
  const history=[];
  workouts.forEach(w=>{const ad=w.athletes?.[selAth];if(!ad)return;
    Object.keys(ad.sets||{}).filter(k=>baseExId(k)===base).forEach(k=>{
      const sets=ad.sets[k].filter(s=>s.completed);if(!sets.length)return;
      history.push({wk:w,sets,exId:k});
      sets.forEach(s=>{const v=s.values||{};
        if(hasW){const w_=Number(v.weight)||0;if(w_>maxW){maxW=w_;maxWDate=w.startTime}
          if(hasR){const r=Number(v.reps)||0;if(w_&&r){const e=w_*(1+r/30);if(e>e1rm){e1rm=Math.round(e*10)/10;e1rmDate=w.startTime}}}}
        if(hasT){const t=Number(v['tf-time']||v.time)||0;if(t>0&&t<bestT){bestT=t;bestTDate=w.startTime;bestTDist=v.distance}}
      })})});
  history.reverse();
  return(<div className="over" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="modal" style={{maxHeight:'94vh'}}>
      <div className="exd-h" style={{paddingTop:18,position:'sticky',top:0,background:'var(--surface)',zIndex:1}}>
        <button className="exd-back" onClick={onClose}><Ic n="x" s={22}/></button>
        <div className="exd-title">{exercise.name}</div>
        {onUpdateMetrics&&<button className="exd-back" onClick={()=>setShowEdit(true)}><Ic n="edit" s={20}/></button>}
      </div>
      {athletes.length>1&&<div style={{display:'flex',gap:6,padding:'10px 18px 4px'}}>
        {athletes.map(a=>(<button key={a.id} onClick={()=>setSelAth(a.id)}
          style={{padding:'6px 12px',borderRadius:20,fontSize:11,fontWeight:800,letterSpacing:'.4px',textTransform:'uppercase',background:selAth===a.id?(a.color||'var(--text)'):'var(--surface2)',color:selAth===a.id?'#fff':'var(--text2)',border:'none'}}>{a.name}</button>))}
      </div>}
      <div className="exd-tabs">
        <button className={'exd-tab'+(tab==='history'?' on':'')} onClick={()=>setTab('history')}>History</button>
        <button className={'exd-tab'+(tab==='instr'?' on':'')} onClick={()=>setTab('instr')}>Stats</button>
      </div>
      {tab==='history'?<div style={{padding:'14px 0'}}>
        {(maxW>0||bestT<Infinity||e1rm>0)&&<div style={{padding:'0 14px'}}>
          {maxW>0&&<div className="ex-pr-card" style={{marginBottom:8}}>
            <div className="ex-pr-l">
              <div className="ex-pr-icon"><Ic n="trophy" s={18}/></div>
              <div className="ex-pr-meta">
                <div className="ex-pr-h">Personal Record</div>
                <div className="ex-pr-v">{maxW} lb</div>
              </div>
            </div>
            <div className="pr-date">{new Date(maxWDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'})}</div>
          </div>}
          {bestT<Infinity&&<div className="ex-pr-card" style={{marginBottom:8}}>
            <div className="ex-pr-l">
              <div className="ex-pr-icon"><Ic n="flame" s={18}/></div>
              <div className="ex-pr-meta">
                <div className="ex-pr-h">Best Time</div>
                <div className="ex-pr-v">{bestTDist?bestTDist+'m · ':''}{bestT}s</div>
              </div>
            </div>
            <div className="pr-date">{new Date(bestTDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'})}</div>
          </div>}
          {e1rm>0&&<div className="ex-pr-card" style={{marginBottom:14}}>
            <div className="ex-pr-l">
              <div className="ex-pr-icon" style={{background:'var(--primary-dim)',color:'var(--primary)'}}><Ic n="bar" s={18}/></div>
              <div className="ex-pr-meta">
                <div className="ex-pr-h">Est. 1RM</div>
                <div className="ex-pr-v">{e1rm} lb</div>
              </div>
            </div>
            <div className="pr-date">{new Date(e1rmDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'})}</div>
          </div>}
        </div>}
        <div style={{padding:'0 18px',fontFamily:'var(--mono)',fontSize:11,fontWeight:800,color:'var(--text3)',letterSpacing:'1px',textTransform:'uppercase',marginTop:8,marginBottom:8}}>{history.length} Sessions</div>
        {history.length===0?<div className="empty"><div className="empty-text">No sessions yet</div></div>
          :history.map((h,i)=>(<div key={i} style={{padding:'14px 18px',borderTop:'1px solid var(--border)'}}>
            <div style={{fontSize:13,fontWeight:800,color:'var(--primary)',marginBottom:6}}>{new Date(h.wk.startTime).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</div>
            {h.sets.map((s,j)=>{const v=s.values;
              const hasDist=v.distance!=null&&v.distance!=='';const hasTfT=v['tf-time']!=null&&v['tf-time']!=='';
              const hasW2=v.weight!=null&&v.weight!=='';const hasR2=v.reps!=null&&v.reps!=='';
              const splits=Object.keys(v).filter(k=>(k.startsWith('split-')||k.startsWith('fly-'))&&v[k]!==''&&v[k]!=null);
              let line='';
              if(hasDist&&hasTfT){line=`${v.distance}m → ${v['tf-time']}s`;
                if(splits.length)line+=' ('+splits.map(k=>{const lab=k.startsWith('split-')?k.replace('split-',''):k.replace(/^fly-(\d+m)-(\d+)$/,'$1fly$2').replace(/^fly-(\d+m)$/,'$1fly');return lab+': '+v[k]}).join(' ')+')'}
              else if(hasW2){line=`${v.weight}lb${hasR2?' × '+v.reps:''}`}
              else if(hasTfT){line=`${v['tf-time']}s`}
              else line=Object.entries(v).filter(([_,vv])=>vv!==''&&vv!=null).map(([k,vv])=>`${vv}${METRIC_MAP[k]?.unit||''}`).join(' · ');
              return(<div key={j} style={{display:'flex',gap:10,fontSize:13,color:'var(--text2)',padding:'2px 0',fontFamily:'var(--mono)'}}>
                <span style={{color:'var(--text3)',width:18,fontWeight:800}}>{j+1}</span>
                <span style={{color:'var(--text)',fontWeight:700}}>{line}</span>
              </div>)})}
          </div>))}
      </div>:<div style={{padding:'18px 14px'}}>
        <div style={{fontFamily:'var(--mono)',fontSize:10,fontWeight:800,color:'var(--text3)',letterSpacing:'1px',textTransform:'uppercase',marginBottom:8}}>Metrics</div>
        <div style={{display:'flex',flexWrap:'wrap',marginBottom:14}}>
          {exercise.metrics.map(m=>{const md=METRIC_MAP[m]||{name:m,unit:''};return<div key={m} className="metric-tag on">{md.name}{md.unit?` (${md.unit})`:''}</div>})}
        </div>
        <div style={{fontFamily:'var(--mono)',fontSize:10,fontWeight:800,color:'var(--text3)',letterSpacing:'1px',textTransform:'uppercase',marginBottom:8}}>Category</div>
        <div className="metric-tag on">{exercise.category}</div>
      </div>}
      {showEdit&&onUpdateMetrics&&<MetricsEditor current={exercise.metrics} onChange={m=>onUpdateMetrics(exercise.id,m)} onClose={()=>setShowEdit(false)}/>}
    </div>
  </div>)}

function PlanModal({plan,date,exercises,onSave,onDelete,onClose}){
  const[name,setName]=useState(plan?.name||'');

  const addEx=ex=>{const exists=exIds.filter(id=>baseExId(id)===ex.id).length;
    const eid=exists?`${ex.id}__${exists+1}`:ex.id;
    setExIds(p=>[...p,eid]);
    const def={};ex.metrics.forEach(m=>{def[m]=''});
    setSetConfigs(p=>({...p,[eid]:[def,def,def]}));
    setShowPicker(false)};
  const removeEx=eid=>{setExIds(p=>p.filter(x=>x!==eid));
    setSetConfigs(p=>{const n={...p};delete n[eid];return n});
    setSupersets(p=>p.map(s=>s.filter(x=>x!==eid)).filter(s=>s.length>1))};
  const updateSetCount=(eid,delta)=>setSetConfigs(p=>{const cur=p[eid]||[];const ex=exercises.find(e=>e.id===baseExId(eid));
    const def={};ex?.metrics.forEach(m=>{def[m]=''});

    return{...p,[eid]:next}});
  const updateRep=(eid,si,mid,v)=>setSetConfigs(p=>({...p,[eid]:p[eid].map((s,i)=>i===si?{...s,[mid]:v===''?'':Number(v)}:s)}));
  const toggleSuperset=(eid1,eid2)=>setSupersets(prev=>{
    const ex=prev.findIndex(ss=>ss.includes(eid1)&&ss.includes(eid2));
    if(ex>=0)return prev.filter((_,i)=>i!==ex);
    const g1=prev.findIndex(ss=>ss.includes(eid1));const g2=prev.findIndex(ss=>ss.includes(eid2));
    if(g1>=0&&g2>=0)return prev;
    if(g1>=0)return prev.map((ss,i)=>i===g1?[...ss,eid2]:ss);

          </div>
        </div>
        <div className="form-g">
          <label className="form-l">Notes / Coach Instructions</label>
          <textarea className="form-input" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Optional plan notes…"/>

          <label className="form-l">Exercises</label>

          {exIds.map((eid,i)=>{const ex=exercises.find(e=>e.id===baseExId(eid));const cfg=setConfigs[eid]||[];
            const ss=supersets.find(s=>s.includes(eid));
            return(<div key={eid} style={{padding:14,border:'1px solid var(--border)',borderRadius:14,marginBottom:8,background:'var(--surface)'}}>

                  <span style={{fontFamily:'var(--mono)',fontSize:10,fontWeight:700,color:'var(--text3)',letterSpacing:'.4px',textTransform:'uppercase',width:60}}>{md.name}</span>
                  <input type="number" className="form-input" style={{padding:'8px 10px',fontSize:13}} placeholder={md.unit||'—'}
                    value={cfg[0][m]??''} onChange={e=>cfg.forEach((_,si)=>updateRep(eid,si,m,e.target.value))}/>
                </div>)})}
              {i<exIds.length-1&&<button onClick={()=>toggleSuperset(eid,exIds[i+1])} style={{marginTop:6,padding:'6px 12px',fontFamily:'var(--mono)',fontSize:10,fontWeight:800,letterSpacing:'.8px',textTransform:'uppercase',color:'var(--primary)',background:'var(--primary-dim)',borderRadius:8,border:'none'}}>{ss&&supersets.find(s=>s.includes(eid)&&s.includes(exIds[i+1]))?'Unlink ↓':'Link ↓'}</button>}
            </div>)})}
          <button className="btn btn-secondary" style={{marginTop:8}} onClick={()=>setShowPicker(true)}>+ Add Exercise</button>
        </div>
        <button className="btn btn-primary" onClick={()=>{if(!name.trim()||!exIds.length)return;
          onSave({id:plan?.id||'pl-'+uid(),date:plan?.date||date||dateKey(Date.now()),name:name.trim(),color,notes,exerciseIds:exIds,setConfigs,supersets});onClose()}}>Save Plan</button>
        {plan&&onDelete&&<button className="btn btn-secondary" style={{marginTop:8,color:'var(--red)',borderColor:'var(--red)'}} onClick={()=>{if(confirm('Delete this plan?')){onDelete(plan.id);onClose()}}}>Delete Plan</button>}
        {showPicker&&<ExercisePicker exercises={exercises} onSelect={addEx} onClose={()=>setShowPicker(false)}/>}
      </div>
    </div>
  </div>)}

// === PULL TO REFRESH ===
function PullRefresh(){
  const[pullY,setPullY]=useState(0);const[refreshing,setRefreshing]=useState(false);
  const ref=useRef({y0:0,active:false,didMove:false});const pullRef=useRef(0);
  useEffect(()=>{
    const inActive=()=>{try{return localStorage.getItem('wk2_activeSession')==='1'}catch{return false}};
    const onStart=e=>{if(refreshing||inActive())return;
      const sc=document.querySelector('.scroll');if(sc&&sc.scrollTop>5)return;
      const t=e.touches[0];ref.current={y0:t.clientY,active:true,didMove:false};pullRef.current=0};
    const onMove=e=>{const r=ref.current;if(!r.active)return;
      const t=e.touches[0];const dy=t.clientY-r.y0;
      if(dy<=0){if(r.didMove){r.active=false;setPullY(0);pullRef.current=0}return}
      r.didMove=true;
      const damped=Math.min(dy*0.5,160);pullRef.current=damped;setPullY(damped)};
    const onEnd=async()=>{const r=ref.current;if(!r.active||!r.didMove){setPullY(0);pullRef.current=0;r.active=false;return}
      r.active=false;const dx=pullRef.current;
      if(dx>60){setRefreshing(true);setPullY(50);
        try{if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();
          if(reg)await reg.update();await new Promise(r=>setTimeout(r,300))}}catch{}
        window.location.reload()}
      else{setPullY(0);pullRef.current=0}};
    document.addEventListener('touchstart',onStart,{passive:true});
    document.addEventListener('touchmove',onMove,{passive:true});
    document.addEventListener('touchend',onEnd,{passive:true});
    return()=>{document.removeEventListener('touchstart',onStart);
      document.removeEventListener('touchmove',onMove);
      document.removeEventListener('touchend',onEnd)};
  },[refreshing]);
  if(pullY<3&&!refreshing)return null;
  const rot=pullY*4;
  return(<div style={{position:'fixed',top:0,left:0,right:0,height:60,display:'flex',alignItems:'center',justifyContent:'center',transform:`translateY(${pullY-60}px)`,transition:refreshing?'transform .25s ease':'none',zIndex:200,pointerEvents:'none'}}>
    <div style={{width:30,height:30,borderRadius:'50%',border:'3px solid rgba(0,0,0,.08)',borderTopColor:'var(--primary)',transform:`rotate(${rot}deg)`,animation:refreshing?'spin .8s linear infinite':'none',background:'#fff',boxShadow:'0 2px 10px rgba(0,0,0,.08)'}}/>
  </div>)}

// === EDIT ATHLETE ===
function EditAthleteModal({athlete,onSave,onClose}){
  const[name,setName]=useState(athlete?.name||'');const[color,setColor]=useState(athlete?.color||'#2156f4');
  const colors=['#06b6d4','#ec4899','#22c55e','#f59e0b','#8b5cf6','#ef4444','#3b82f6','#10b981'];
  return(<div className="over" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="modal">
      <div className="modal-h">
        <div className="modal-t">Edit Athlete</div>
        <button className="modal-x" onClick={onClose}><Ic n="x" s={20}/></button>
      </div>
      <div className="modal-b">
        <div className="form-g">
          <label className="form-l">Name</label>
          <input className="form-input" value={name} onChange={e=>setName(e.target.value)}/>
        </div>
        <div className="form-g">
          <label className="form-l">Color</label>
          <div style={{display:'flex',flexWrap:'wrap',gap:10,marginTop:8}}>
            {colors.map(c=><button key={c} onClick={()=>setColor(c)}
              style={{width:42,height:42,borderRadius:'50%',background:c,border:color===c?'3px solid var(--text)':'3px solid transparent',cursor:'pointer'}}/>)}
          </div>
        </div>
        <button className="btn btn-primary" onClick={()=>{if(!name.trim())return;onSave({...athlete,name:name.trim(),color});onClose()}}>Save</button>
      </div>
    </div>
  </div>)}

// === APP ROOT ===
function App(){
  const[athletes,setAthletes]=useStore('athletes',DEFAULT_ATHLETES);
  const[exercises,setExercises]=useStore('exercises',[]);
  const[workouts,setWorkouts]=useStore('workouts2',[]);
  const[planned,setPlanned]=useStore('planned2',[]);
  const[customTags,setCustomTags]=useStore('customTags',[]);
  const[templates,setTemplates]=useStore('templates',[]);
  const allTags=[...DEFAULT_TAGS,...customTags];
  const[activeAth,setActiveAth]=useState(()=>localStorage.getItem('wk2_v3_activeAth')||athletes[0]?.id);
  useEffect(()=>{try{localStorage.setItem('wk2_v3_activeAth',activeAth)}catch{}},[activeAth]);

  const[tab,setTab]=useState('today');
  const[selDate,setSelDate]=useState(new Date());
  const[inWorkout,setInWorkout]=useState(()=>localStorage.getItem('wk2_activeSession')==='1');
  const[activePlan,setActivePlan]=useState(()=>{try{return JSON.parse(localStorage.getItem('wk2_activePlan')||'null')}catch{return null}});
  const[viewing,setViewing]=useState(null);
  const[viewEx,setViewEx]=useState(null);
  const[editAthlete,setEditAthlete]=useState(null);
  const[planEdit,setPlanEdit]=useState(null); // {plan, date} or {date} for new
  const[remoteSession,setRemoteSession]=useState(null);
  const savePlan=p=>{setPlanned(prev=>{const ex=prev.findIndex(x=>x.id===p.id);if(ex>=0){const n=[...prev];n[ex]=p;return n}return[...prev,p]})};
  const deletePlan=id=>setPlanned(prev=>prev.filter(p=>p.id!==id));
  const saveTemplate=wk=>{const tpl={id:'tpl-'+uid(),name:wk.name||'Template',color:wk.tag?.color||wk.color||'#2156f4',createdAt:Date.now(),
    exerciseIds:[...new Set(wk.exerciseIds.map(baseExId))],supersets:[],
    setConfigs:Object.fromEntries(wk.exerciseIds.map(eid=>{const base=baseExId(eid);
      const cnt=Math.max(...Object.values(wk.athletes).map(a=>(a.sets[eid]||[]).filter(s=>s.completed).length),0);
      return[base,Array(cnt||3).fill({})]}))};
    setTemplates(p=>[...p,tpl])};

  const _pull=useCallback(()=>{if(!sb)return;
    sb.from('wk_store').select('value').eq('key','sharedActiveSession').maybeSingle().then(({data})=>{
      const v=data?.value||null;
      if(v&&Date.now()-(v.updatedAt||0)>4*3600*1000){setRemoteSession(null);return}
      setRemoteSession(v)}).catch(()=>{})},[]);
  useEffect(()=>{_pull();const iv=setInterval(_pull,20000);return()=>clearInterval(iv)},[_pull]);

  const _push=(planId,plan,snapshot)=>{if(!sb)return;
    sb.from('wk_store').upsert({key:'sharedActiveSession',value:{planId,plan:plan||null,snapshot:snapshot||null,updatedAt:Date.now()},updated_at:new Date().toISOString()}).then(()=>{})};
  const _clear=()=>{if(!sb)return;sb.from('wk_store').delete().eq('key','sharedActiveSession').then(()=>{});setRemoteSession(null)};

  const startPlan=plan=>{['activeSession','activePlan'].forEach(k=>{try{localStorage.removeItem('wk2_'+k)}catch{}});
    try{localStorage.removeItem('wk2_v3_snap')}catch{}
    try{localStorage.setItem('wk2_activeSession','1');localStorage.setItem('wk2_activePlan',JSON.stringify(plan))}catch{}
    _push(plan?.id||null,plan,null);
    setActivePlan(plan);setInWorkout(true)};
  const startEmpty=()=>{['activeSession','activePlan'].forEach(k=>{try{localStorage.removeItem('wk2_'+k)}catch{}});
    try{localStorage.removeItem('wk2_v3_snap')}catch{}
    try{localStorage.setItem('wk2_activeSession','1')}catch{}
    _push(null,null,null);setActivePlan(null);setInWorkout(true)};
  const resumeRemote=()=>{if(!remoteSession)return;
    const plan=remoteSession.planId?(planned.find(p=>p.id===remoteSession.planId)||remoteSession.plan):remoteSession.plan;
    if(remoteSession.snapshot)try{localStorage.setItem('wk2_activeSnapshot',JSON.stringify(remoteSession.snapshot))}catch{}
    try{localStorage.setItem('wk2_activeSession','1');if(plan)localStorage.setItem('wk2_activePlan',JSON.stringify(plan))}catch{}
    setActivePlan(plan||null);setInWorkout(true)};

  const finishWorkout=wk=>{['activeSession','activePlan','activeSnapshot'].forEach(k=>{try{localStorage.removeItem('wk2_'+k)}catch{}});
    try{localStorage.removeItem('wk2_v3_snap')}catch{}
    _clear();
    if(wk.exerciseIds.length>0)setWorkouts(p=>[...p,wk]);
    if(activePlan&&!activePlan.id?.startsWith('tpl-'))setPlanned(p=>p.filter(pl=>pl.id!==activePlan.id));
    setInWorkout(false);setActivePlan(null)};
  const cancelWorkout=()=>{['activeSession','activePlan','activeSnapshot'].forEach(k=>{try{localStorage.removeItem('wk2_'+k)}catch{}});
    try{localStorage.removeItem('wk2_v3_snap')}catch{}
    _clear();setInWorkout(false);setActivePlan(null)};

  const ath=athletes.find(a=>a.id===activeAth);

  // Per-athlete primary color
  // One-shot seed: add new exercises + plans introduced in v3
  useEffect(()=>{const KEY='wk2_v3_seed_hamstring_1';
    if(localStorage.getItem(KEY)==='1')return;
    if(!exercises.length)return; // wait for exercises to load
    const newExs=[
      {id:'sl-hamstring-bridge-iso',name:'SL Hamstring Bridge Iso',category:'Legs',metrics:['time','reps']},
      {id:'slider-ecc-curl',name:'Slider Eccentric Curl',category:'Legs',metrics:['reps']},
      {id:'nordic-iso-hold',name:'Nordic Iso Hold',category:'Legs',metrics:['time','reps']},
      {id:'bosu-sl-stab',name:'Bosu SL Stability',category:'Legs',metrics:['time']},
      {id:'iso-takeoff',name:'Iso Takeoff',category:'Legs',metrics:['time','reps']},
      {id:'iso-ankle',name:'Iso Ankle',category:'Legs',metrics:['time','reps']},
      {id:'depth-jump-pop',name:'Depth Jump + Pop',category:'Legs',metrics:['reps']},
      {id:'ohp',name:'Overhead Press',category:'Shoulders',metrics:['weight','reps']},
    ];
    const exIds=new Set(exercises.map(e=>e.id));
    const missing=newExs.filter(e=>!exIds.has(e.id));
    if(missing.length)setExercises(p=>[...p,...missing]);
    setPlanned(p=>{if(p.find(x=>x.id==='pl-hamstring-1'))return p;
      return[...p,{id:'pl-hamstring-1',date:'2026-05-08',name:'Hamstring Prep + Power',color:'#ec4899',
        exerciseIds:['sl-hamstring-bridge-iso','slider-ecc-curl','nordic-iso-hold','bosu-sl-stab','tb-jump','iso-takeoff','iso-ankle','depth-jump-pop','ohp'],
        supersets:[],
        setConfigs:{
          'sl-hamstring-bridge-iso':[{time:10,reps:10},{time:10,reps:10},{time:10,reps:10}],
          'slider-ecc-curl':[{reps:4},{reps:4}],
          'nordic-iso-hold':[{time:5,reps:1},{time:5,reps:1},{time:5,reps:1}],
          'bosu-sl-stab':[{time:30}],
          'tb-jump':[{reps:3},{reps:3},{reps:3}],
          'iso-takeoff':[{time:4,reps:1},{time:4,reps:1}],
          'iso-ankle':[{time:4,reps:1},{time:4,reps:1}],
          'depth-jump-pop':[{reps:3}],
          'ohp':[{reps:3},{reps:3}]},
        exerciseAthletes:{
          'sl-hamstring-bridge-iso':['ath-2'],
          'slider-ecc-curl':['ath-2'],
          'nordic-iso-hold':['ath-2']},
        notes:'Miška hamstring prep (5 min): SL Hamstring Bridge Iso 30°/60°/90° ×10s/nohu, Slider Ecc Curls 2×4/nohu, Nordic Iso Hold 3×5s. Both: Bosu SL Stab 1×30s/nohu, TB Jump 3×3 cluster (mean 1.1-1.3 m/s, peak 2.0+), Iso Odraz 2×4s max (Smith Machine, touch-down), Iso Členok 2×4s max (toe-off), Zoskok+Výskok 1×3 (GCT pod 200ms), OHP 2×3 (mean 0.50-0.70 m/s).'
      }]});
    localStorage.setItem(KEY,'1')
  },[exercises.length]);

  useEffect(()=>{const c=ath?.color||'#2156f4';
    document.documentElement.style.setProperty('--primary',c);
    const dark=c.replace(/^#/,'');const r=parseInt(dark.slice(0,2),16),g=parseInt(dark.slice(2,4),16),b=parseInt(dark.slice(4,6),16);
    document.documentElement.style.setProperty('--primary-dark',`rgb(${Math.max(0,r-30)},${Math.max(0,g-30)},${Math.max(0,b-30)})`);
    document.documentElement.style.setProperty('--primary-dim',`rgba(${r},${g},${b},.1)`);
    document.querySelector('meta[name=theme-color]')?.setAttribute('content','#ffffff');
  },[activeAth,ath?.color]);

  if(inWorkout)return(<ActiveWorkout athletes={athletes} activeAth={activeAth} setActiveAth={setActiveAth}
    exercises={exercises} setExercises={setExercises} workouts={workouts} initialPlan={activePlan}
    onFinish={finishWorkout} onCancel={cancelWorkout} allTags={allTags}/>);

  return(<>
    <PullRefresh/>
    {tab==='today'&&<TodayScreen athletes={athletes} activeAth={activeAth} setActiveAth={setActiveAth}
      workouts={workouts} planned={planned} exercises={exercises} templates={templates}
      onStartPlan={startPlan} onStartEmpty={startEmpty} onView={setViewing}
      onAddPlan={d=>setPlanEdit({date:d||dateKey(Date.now())})}
      onEditPlan={p=>setPlanEdit({plan:p})}
      remoteSession={remoteSession} onResume={resumeRemote}
      selDate={selDate} setSelDate={setSelDate}/>}
    {tab==='train'&&<CalScreen athletes={athletes} activeAth={activeAth} setActiveAth={setActiveAth}
      workouts={workouts} planned={planned} onView={setViewing}
      onAddPlan={d=>setPlanEdit({date:d||dateKey(Date.now())})}
      onEditPlan={p=>setPlanEdit({plan:p})}/>}
    {tab==='lib'&&<LibraryScreen exercises={exercises} onSelect={setViewEx} onCreate={ex2=>setExercises(p=>[...p,ex2])}/>}
    {tab==='stats'&&<StatScreen workouts={workouts} activeAth={activeAth} exercises={exercises} onView={setViewing} onSelectEx={setViewEx}/>}
    {tab==='me'&&<ProfileScreen athletes={athletes} activeAth={activeAth} setActiveAth={setActiveAth} onEditAthlete={setEditAthlete} workouts={workouts}/>}

    {viewing&&<WorkoutDetailModal wk={viewing} athletes={athletes} exercises={exercises}
      onClose={()=>setViewing(null)}
      onDelete={id=>setWorkouts(p=>p.filter(w=>w.id!==id))}
      onUpdate={updated=>{setWorkouts(p=>p.map(w=>w.id===updated.id?updated:w));setViewing(updated)}}
      onSaveTemplate={saveTemplate}
      onRepeat={wk=>{const plan={id:'pl-'+uid(),name:wk.name||'Workout',exerciseIds:wk.exerciseIds.map(baseExId),
        supersets:[],setConfigs:{}};wk.exerciseIds.forEach(eid=>{const base=baseExId(eid);
          const ss=Object.values(wk.athletes).flatMap(a=>(a.sets[eid]||[]).filter(s=>s.completed));
          if(ss.length)plan.setConfigs[base]=ss.map(s=>{const cfg={};Object.entries(s.values).forEach(([k,v])=>{if(v!==''&&v!=null)cfg[k]=v});return cfg})});
        setViewing(null);startPlan(plan)}}/>}
    {planEdit&&<PlanModal plan={planEdit.plan} date={planEdit.date} exercises={exercises}
      onSave={savePlan} onDelete={deletePlan} onClose={()=>setPlanEdit(null)}/>}
    {viewEx&&<ExerciseDetail exercise={viewEx} athletes={athletes} activeAth={activeAth} workouts={workouts}
      onClose={()=>setViewEx(null)}
      onUpdateMetrics={(id,m)=>{setExercises(p=>p.map(e=>e.id===id?{...e,metrics:m}:e));setViewEx(e=>({...e,metrics:m}))}}/>}
    {editAthlete&&<EditAthleteModal athlete={editAthlete} onSave={a=>setAthletes(p=>p.map(x=>x.id===a.id?a:x))} onClose={()=>setEditAthlete(null)}/>}

    {tab==='today'&&<button className="fab" onClick={startEmpty}><Ic n="plus" s={22}/></button>}

    <nav className="tabs">
      {[
        {id:'today',ic:'home',l:'Home'},
        {id:'train',ic:'cal',l:'Training'},
        {id:'lib',ic:'book',l:'Library'},
        {id:'stats',ic:'bar',l:'Stats'},
        {id:'me',ic:'user',l:'Me',ath:true},
      ].map(t=>(<button key={t.id} className={'tab'+(tab===t.id?' on':'')} onClick={()=>setTab(t.id)}>
        {t.ath?<div className="tab-ath" style={{background:ath?.color||'var(--surface3)',color:'#fff'}}>{ath?.photo?<img src={ath.photo}/>:initials(ath?.name||'')}</div>
          :<Ic n={t.ic} s={22}/>}
        <span className="lbl">{t.l}</span>
      </button>))}
    </nav>
  </>)}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'})}
</script>
